<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Greitas Auto – stabili versija</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#dbe2ea;--pri:#111827;--priText:#fff;--green:#15803d;--greenBg:#dcfce7;--red:#b91c1c;--redBg:#fee2e2;--amber:#b45309;--amberBg:#fef3c7;--blue:#1d4ed8;--blueBg:#dbeafe;--shadow:0 12px 30px rgba(15,23,42,.08);--safe:env(safe-area-inset-bottom,0px)}
[data-theme="dark"]{--bg:#0f141a;--card:#171d24;--text:#f8fafc;--muted:#aab4c0;--line:#2d3743;--pri:#f8fafc;--priText:#111827;--greenBg:#143824;--redBg:#3b1e1e;--amberBg:#3b2c12;--blueBg:#172d49;--shadow:0 14px 34px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{padding-bottom:calc(84px + var(--safe))}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:12px 14px 24px}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:8px 0 12px;background:linear-gradient(var(--bg) 78%,transparent)}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;background:var(--pri);color:var(--priText);display:grid;place-items:center;font-weight:900}.brand h1{font-size:1.08rem;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:.75rem}.icon{width:46px;height:46px;border:1px solid var(--line);border-radius:13px;background:var(--card);box-shadow:var(--shadow);font-size:1.1rem}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:6px 0 14px}.head h2{margin:0;font-size:1.7rem}.head p{margin:5px 0 0;color:var(--muted);font-size:.88rem}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi,.card{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}.kpi{padding:13px;min-height:105px;display:flex;flex-direction:column;justify-content:space-between}.kpi span{color:var(--muted);font-size:.77rem;font-weight:800}.kpi strong{font-size:1.55rem}.good{background:var(--greenBg)!important;color:var(--green)}.bad{background:var(--redBg)!important;color:var(--red)}.warn{background:var(--amberBg)!important;color:var(--amber)}.blue{background:var(--blueBg)!important;color:var(--blue)}.pad{padding:14px}.btn{min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:800}.btn.primary{background:var(--pri);color:var(--priText);border-color:var(--pri)}.btn.danger{background:var(--redBg);color:var(--red)}.btn.full{width:100%}.toolbar{display:grid;gap:9px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;background:var(--card);padding:10px 12px;outline:none}.form textarea{min-height:88px;resize:vertical}.seg{display:flex;gap:5px;overflow:auto}.seg button{min-height:40px;border:0;border-radius:10px;background:transparent;padding:8px 11px;white-space:nowrap;color:var(--muted);font-weight:800}.seg button.active{background:var(--blueBg);color:var(--blue)}.list{display:grid;gap:12px}.car,.lead,.contact{padding:14px}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.row h3{margin:0;font-size:1.05rem}.meta{color:var(--muted);font-size:.8rem;line-height:1.4}.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.badge{border-radius:999px;padding:6px 9px;background:var(--blueBg);color:var(--blue);font-size:.72rem;font-weight:850}.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.num{padding:9px;border-radius:11px;background:var(--bg)}.num small{display:block;color:var(--muted);font-size:.68rem;margin-bottom:4px}.num strong{font-size:.9rem}.actions{display:flex;gap:7px;overflow:auto;margin-top:11px}.actions .btn{min-height:40px;padding:8px 11px;white-space:nowrap;font-size:.8rem}.empty{padding:28px 16px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted);background:var(--card)}.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(76px + var(--safe));padding:7px 8px calc(7px + var(--safe));border-top:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}[data-theme="dark"] .nav{background:rgba(15,20,26,.94)}.navin{height:100%;max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.navbtn{border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:.68rem;font-weight:800;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px}.navbtn b{font-size:1.25rem}.navbtn.active{background:var(--blueBg);color:var(--blue)}.fab{position:fixed;right:16px;bottom:calc(92px + var(--safe));z-index:45;width:58px;height:58px;border:0;border-radius:50%;background:var(--pri);color:var(--priText);font-size:1.7rem;box-shadow:0 16px 32px rgba(15,23,42,.28)}.overlay{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.48);display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;max-height:92vh;background:var(--card);border-radius:22px 22px 0 0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.sheethead,.sheetfoot{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.sheetfoot{border-top:1px solid var(--line);border-bottom:0;padding-bottom:calc(13px + var(--safe))}.sheethead h2{margin:0;font-size:1.08rem}.sheetbody{padding:14px;overflow:auto}.form{display:grid;gap:11px}.form label{display:grid;gap:6px;color:var(--muted);font-size:.82rem;font-weight:750}.formrow{display:grid;gap:10px}.toast{position:fixed;left:50%;bottom:calc(166px + var(--safe));transform:translateX(-50%);z-index:200;background:var(--pri);color:var(--priText);padding:11px 14px;border-radius:12px;font-weight:800;display:none;max-width:90%;text-align:center}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectiontitle h3{margin:0}.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.wrap{padding-left:22px;padding-right:22px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.formrow{grid-template-columns:repeat(2,minmax(0,1fr))}.list.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.overlay{align-items:center;justify-content:center}.sheet{max-width:720px;border-radius:20px;max-height:88vh}.nav{left:50%;right:auto;transform:translateX(-50%);width:min(680px,calc(100% - 28px));bottom:12px;border:1px solid var(--line);border-radius:20px}.fab{right:calc(50% - 530px)}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">GA</div><div><h1>Greitas Auto</h1><p>stabili vieno failo versija</p></div></div><button class="icon" id="themeBtn" type="button" aria-label="Keisti temą">◐</button></header>
<main id="app"></main>
</div>
<button class="fab" id="fab" type="button" aria-label="Pridėti">+</button>
<nav class="nav"><div class="navin">
<button class="navbtn" data-tab="dashboard"><b>⌂</b><span>Pagrindinis</span></button>
<button class="navbtn" data-tab="cars"><b>🚗</b><span>Auto</span></button>
<button class="navbtn" data-tab="leads"><b>◎</b><span>Variantai</span></button>
<button class="navbtn" data-tab="contacts"><b>👤</b><span>Klientai</span></button>
<button class="navbtn" data-tab="settings"><b>⚙</b><span>Nustatymai</span></button>
</div></nav>
<div class="overlay" id="overlay"><div class="sheet"><div class="sheethead"><h2 id="sheetTitle">Langas</h2><button class="icon" id="closeSheet" type="button">×</button></div><div class="sheetbody" id="sheetBody"></div><div class="sheetfoot" id="sheetFoot"></div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var KEY='greitas_auto_stabili_v1';
var THEME='greitas_auto_theme';
var state={tab:'dashboard',carFilter:'visi',leadFilter:'visi',search:''};
var app=document.getElementById('app');
var overlay=document.getElementById('overlay');
var sheetTitle=document.getElementById('sheetTitle');
var sheetBody=document.getElementById('sheetBody');
var sheetFoot=document.getElementById('sheetFoot');
var toastEl=document.getElementById('toast');
var db=load();
function uid(p){return p+'_'+new Date().getTime()+'_'+Math.random().toString(36).slice(2,8)}
function now(){return new Date().toISOString()}
function today(){return now().slice(0,10)}
function n(v){var x=Number(String(v||0).replace(',','.'));return isFinite(x)?x:0}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(v){try{return new Intl.NumberFormat('lt-LT',{style:'currency',currency:db.settings.currency||'EUR',maximumFractionDigits:0}).format(n(v))}catch(e){return Math.round(n(v))+' '+(db.settings.currency||'EUR')}}
function date(v){if(!v)return 'Nenurodyta';var d=new Date(v);return isNaN(d.getTime())?'Nenurodyta':d.toLocaleDateString('lt-LT')}
function days(v,end){if(!v)return 0;var a=new Date(v),b=end?new Date(end):new Date();return Math.max(0,Math.floor((b-a)/86400000))}
function blank(){return {cars:[],expenses:[],tasks:[],leads:[],contacts:[],sales:[],settings:{currency:'EUR',theme:'light'}}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.cars&&x.settings)return x}catch(e){}var d=blank();seed(d);return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Nepavyko išsaugoti. Naršyklės saugykla pilna.');return false}}
function seed(d){d.cars=[{id:uid('car'),brand:'Lexus',model:'IS250',year:2006,fuel:'Benzinas',gear:'Automatinė',location:'Kaunas',purchaseDate:today(),purchasePrice:500,quickPrice:1150,listPrice:1450,status:'Paruoštas',notes:'Demo automobilis',createdAt:now()},{id:uid('car'),brand:'Mitsubishi',model:'Pajero',year:2006,fuel:'Dyzelinas',gear:'Mechaninė',location:'Vilnius',purchaseDate:today(),purchasePrice:500,quickPrice:1250,listPrice:1700,status:'Tvarkomas',notes:'Demo automobilis',createdAt:now()}];d.leads=[{id:uid('lead'),brand:'Toyota',model:'Avensis',year:2008,city:'Šiauliai',price:1500,target:800,phone:'+37060011111',status:'Skambinti',notes:'Patikrinti TA',createdAt:now()}];d.contacts=[{id:uid('contact'),name:'Tomas',phone:'+37060033333',city:'Kaunas',type:'Pirkėjas',notes:'Ieško 4x4 iki 2500',createdAt:now()}];saveData(d)}
function saveData(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function expenseTotal(carId){var s=0,i;for(i=0;i<db.expenses.length;i++)if(db.expenses[i].carId===carId)s+=n(db.expenses[i].amount);return s}
function calc(c){var exp=expenseTotal(c.id),cost=n(c.purchasePrice)+exp,profit=n(c.quickPrice)-cost;return {exp:exp,cost:cost,profit:profit,days:days(c.purchaseDate)}}
function toast(msg){toastEl.innerHTML=esc(msg);toastEl.style.display='block';clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.style.display='none'},2600)}
function head(t,s,button){return '<section class="head"><div><h2>'+esc(t)+'</h2><p>'+esc(s)+'</p></div>'+(button||'')+'</section>'}
function empty(t){return '<div class="empty">'+esc(t)+'</div>'}
function setActive(){var bs=document.querySelectorAll('[data-tab]'),i;for(i=0;i<bs.length;i++)bs[i].className='navbtn'+(bs[i].getAttribute('data-tab')===state.tab?' active':'')}
function render(){setActive();if(state.tab==='cars')renderCars();else if(state.tab==='leads')renderLeads();else if(state.tab==='contacts')renderContacts();else if(state.tab==='settings')renderSettings();else renderDashboard()}
function renderDashboard(){var active=[],i,total=0,profit=0;for(i=0;i<db.cars.length;i++){if(db.cars[i].status!=='Parduota'){active.push(db.cars[i]);var c=calc(db.cars[i]);total+=c.cost;profit+=c.profit}}app.innerHTML=head('Pagrindinis','Svarbiausi verslo skaičiai vienoje vietoje.')+'<section class="grid kpis"><div class="kpi blue"><span>Aktyvūs automobiliai</span><strong>'+active.length+'</strong></div><div class="kpi '+(profit>=0?'good':'bad')+'"><span>Greito pardavimo pelnas</span><strong>'+money(profit)+'</strong></div><div class="kpi warn"><span>Užšaldytas kapitalas</span><strong>'+money(total)+'</strong></div><div class="kpi"><span>Variantai</span><strong>'+db.leads.length+'</strong></div></section><section class="card pad" style="margin-top:12px"><div class="sectiontitle"><h3>Aktyvūs automobiliai</h3><button class="btn" data-tabgo="cars">Rodyti visus</button></div><div class="grid">'+(active.length?active.slice(0,4).map(carMini).join(''):empty('Automobilių nėra'))+'</div></section><section class="card pad" style="margin-top:12px"><div class="sectiontitle"><h3>Greiti veiksmai</h3></div><div class="grid two"><button class="btn" data-action="carForm">+ Automobilis</button><button class="btn" data-action="leadForm">+ Variantas</button><button class="btn" data-action="contactForm">+ Klientas</button><button class="btn" data-action="expenseForm">+ Išlaida</button></div></section>'}
function carMini(c){var x=calc(c);return '<div class="row"><div><h3>'+esc(c.brand+' '+c.model+' '+c.year)+'</h3><div class="meta">'+esc(c.location||'')+' · '+x.days+' d.</div></div><span class="badge">'+money(x.profit)+'</span></div>'}
function renderCars(){var q=state.search.toLowerCase(),arr=[],i,c,x;for(i=0;i<db.cars.length;i++){c=db.cars[i];x=calc(c);var hay=(c.brand+' '+c.model+' '+c.year+' '+c.location+' '+c.status).toLowerCase();if(q&&hay.indexOf(q)<0)continue;if(state.carFilter==='aktyvūs'&&c.status==='Parduota')continue;if(state.carFilter==='parduoti'&&c.status!=='Parduota')continue;if(state.carFilter==='minusas'&&x.profit>=0)continue;arr.push(c)}app.innerHTML=head('Automobiliai','Pirkimo, išlaidų ir pardavimo kontrolė.','<button class="btn primary" data-action="carForm">Pridėti</button>')+'<section class="toolbar"><input id="carSearch" type="search" placeholder="Ieškoti..." value="'+esc(state.search)+'"><div class="seg"><button data-carfilter="visi" class="'+(state.carFilter==='visi'?'active':'')+'">Visi</button><button data-carfilter="aktyvūs" class="'+(state.carFilter==='aktyvūs'?'active':'')+'">Aktyvūs</button><button data-carfilter="parduoti" class="'+(state.carFilter==='parduoti'?'active':'')+'">Parduoti</button><button data-carfilter="minusas" class="'+(state.carFilter==='minusas'?'active':'')+'">Minusas</button></div></section><section class="list cards">'+(arr.length?arr.map(carCard).join(''):empty('Nieko nerasta'))+'</section>';document.getElementById('carSearch').oninput=function(){state.search=this.value;renderCars()}}
function carCard(c){var x=calc(c),tone=x.profit<0?'bad':x.profit<300?'warn':'good';return '<article class="card car"><div class="row"><div><h3>'+esc(c.brand+' '+c.model+' '+c.year)+'</h3><div class="meta">'+esc(c.location||'')+' · '+esc(c.fuel||'')+' · '+esc(c.gear||'')+'</div></div><span class="badge">'+esc(c.status||'Sandėlyje')+'</span></div><div class="badges"><span class="badge '+tone+'">Pelnas '+money(x.profit)+'</span><span class="badge">Stovi '+x.days+' d.</span></div><div class="nums"><div class="num"><small>Pirkta</small><strong>'+money(c.purchasePrice)+'</strong></div><div class="num"><small>Išlaidos</small><strong>'+money(x.exp)+'</strong></div><div class="num"><small>Greitai</small><strong>'+money(c.quickPrice)+'</strong></div></div><div class="actions"><button class="btn" data-action="carForm" data-id="'+c.id+'">Redaguoti</button><button class="btn" data-action="expenseForm" data-id="'+c.id+'">Išlaida</button><button class="btn" data-action="sale" data-id="'+c.id+'">Parduota</button><button class="btn danger" data-action="deleteCar" data-id="'+c.id+'">Trinti</button></div></article>'}
function renderLeads(){var arr=[],i,l;for(i=0;i<db.leads.length;i++){l=db.leads[i];if(state.leadFilter==='visi'||l.status===state.leadFilter)arr.push(l)}app.innerHTML=head('Variantai','Dominantys automobiliai ir skambučių planas.','<button class="btn primary" data-action="leadForm">Pridėti</button>')+'<section class="toolbar"><div class="seg"><button data-leadfilter="visi" class="'+(state.leadFilter==='visi'?'active':'')+'">Visi</button><button data-leadfilter="Naujas" class="'+(state.leadFilter==='Naujas'?'active':'')+'">Nauji</button><button data-leadfilter="Skambinti" class="'+(state.leadFilter==='Skambinti'?'active':'')+'">Skambinti</button><button data-leadfilter="Nupirkta" class="'+(state.leadFilter==='Nupirkta'?'active':'')+'">Nupirkta</button></div></section><section class="list cards">'+(arr.length?arr.map(leadCard).join(''):empty('Variantų nėra'))+'</section>'}
function leadCard(l){return '<article class="card lead"><div class="row"><div><h3>'+esc(l.brand+' '+l.model+' '+l.year)+'</h3><div class="meta">'+esc(l.city||'')+' · '+esc(l.phone||'')+'</div></div><span class="badge">'+esc(l.status||'Naujas')+'</span></div><div class="nums" style="margin-top:10px"><div class="num"><small>Kaina</small><strong>'+money(l.price)+'</strong></div><div class="num"><small>Tikslas</small><strong>'+money(l.target)+'</strong></div><div class="num"><small>Skirtumas</small><strong>'+money(n(l.price)-n(l.target))+'</strong></div></div><p class="meta">'+esc(l.notes||'')+'</p><div class="actions">'+(l.phone?'<a class="btn" href="tel:'+esc(String(l.phone).replace(/[^0-9+]/g,''))+'">Skambinti</a>':'')+'<button class="btn" data-action="leadForm" data-id="'+l.id+'">Redaguoti</button><button class="btn" data-action="convertLead" data-id="'+l.id+'">Paversti auto</button><button class="btn danger" data-action="deleteLead" data-id="'+l.id+'">Trinti</button></div></article>'}
function renderContacts(){app.innerHTML=head('Klientai','Pirkėjai, pardavėjai ir partneriai.','<button class="btn primary" data-action="contactForm">Pridėti</button>')+'<section class="list cards">'+(db.contacts.length?db.contacts.map(contactCard).join(''):empty('Klientų nėra'))+'</section>'}
function contactCard(c){return '<article class="card contact"><div class="row"><div><h3>'+esc(c.name)+'</h3><div class="meta">'+esc(c.type||'Klientas')+' · '+esc(c.city||'')+'</div></div></div><p class="meta">'+esc(c.notes||'')+'</p><div class="actions">'+(c.phone?'<a class="btn" href="tel:'+esc(String(c.phone).replace(/[^0-9+]/g,''))+'">Skambinti</a><a class="btn" href="sms:'+esc(String(c.phone).replace(/[^0-9+]/g,''))+'">SMS</a>':'')+'<button class="btn" data-action="contactForm" data-id="'+c.id+'">Redaguoti</button><button class="btn danger" data-action="deleteContact" data-id="'+c.id+'">Trinti</button></div></article>'}
function renderSettings(){app.innerHTML=head('Nustatymai','Duomenų kopijos ir programos parinktys.')+'<section class="card pad"><div class="form"><label>Valiuta<select id="currency"><option value="EUR">EUR</option><option value="USD">USD</option><option value="PLN">PLN</option></select></label><label>Tema<select id="theme"><option value="light">Šviesi</option><option value="dark">Tamsi</option></select></label><button class="btn" data-action="export">Eksportuoti JSON kopiją</button><label class="btn" style="display:block;text-align:center">Importuoti JSON<input id="importFile" type="file" accept="application/json" style="display:none"></label><button class="btn danger" data-action="reset">Atkurti demo duomenis</button></div></section><section class="card pad" style="margin-top:12px"><h3 style="margin-top:0">Būsena</h3><p class="meta">Automobiliai: '+db.cars.length+' · Variantai: '+db.leads.length+' · Klientai: '+db.contacts.length+'</p><p class="meta">Duomenys saugomi šioje naršyklėje. Reguliariai eksportuok JSON kopiją.</p></section>';var cu=document.getElementById('currency'),th=document.getElementById('theme');cu.value=db.settings.currency||'EUR';th.value=db.settings.theme||'light';cu.onchange=function(){db.settings.currency=this.value;save();renderSettings()};th.onchange=function(){db.settings.theme=this.value;applyTheme();save()};document.getElementById('importFile').onchange=importJson}
function openSheet(title,body,foot){sheetTitle.innerHTML=esc(title);sheetBody.innerHTML=body;sheetFoot.innerHTML=foot||'<button class="btn" data-close="1">Uždaryti</button>';overlay.className='overlay open';document.body.style.overflow='hidden'}
function closeSheet(){overlay.className='overlay';document.body.style.overflow='';sheetBody.innerHTML='';sheetFoot.innerHTML=''}
function formVal(form,name){var el=form.elements[name];return el?el.value:''}
function carForm(id){var c=find(db.cars,id)||{};openSheet(id?'Redaguoti automobilį':'Naujas automobilis','<form id="carForm" class="form"><div class="formrow"><label>Markė<input name="brand" required value="'+esc(c.brand||'')+'"></label><label>Modelis<input name="model" required value="'+esc(c.model||'')+'"></label></div><div class="formrow"><label>Metai<input name="year" type="number" value="'+esc(c.year||'')+'"></label><label>Miestas<input name="location" value="'+esc(c.location||'')+'"></label></div><div class="formrow"><label>Kuras<input name="fuel" value="'+esc(c.fuel||'')+'"></label><label>Pavarų dėžė<input name="gear" value="'+esc(c.gear||'')+'"></label></div><div class="formrow"><label>Pirkimo data<input name="purchaseDate" type="date" value="'+esc(c.purchaseDate||today())+'"></label><label>Pirkimo kaina<input name="purchasePrice" type="number" step="0.01" value="'+esc(c.purchasePrice||'')+'"></label></div><div class="formrow"><label>Greito pardavimo kaina<input name="quickPrice" type="number" step="0.01" value="'+esc(c.quickPrice||'')+'"></label><label>Skelbimo kaina<input name="listPrice" type="number" step="0.01" value="'+esc(c.listPrice||'')+'"></label></div><label>Statusas<select name="status"><option>Sandėlyje</option><option>Tvarkomas</option><option>Paruoštas</option><option>Rezervuotas</option><option>Parduota</option></select></label><label>Pastabos<textarea name="notes">'+esc(c.notes||'')+'</textarea></label></form>','<button class="btn" data-close="1">Atšaukti</button><button class="btn primary" data-savecar="'+esc(id||'')+'">Išsaugoti</button>');var s=document.getElementById('carForm').elements.status;s.value=c.status||'Sandėlyje'}
function leadForm(id){var l=find(db.leads,id)||{};openSheet(id?'Redaguoti variantą':'Naujas variantas','<form id="leadForm" class="form"><div class="formrow"><label>Markė<input name="brand" required value="'+esc(l.brand||'')+'"></label><label>Modelis<input name="model" required value="'+esc(l.model||'')+'"></label></div><div class="formrow"><label>Metai<input name="year" type="number" value="'+esc(l.year||'')+'"></label><label>Miestas<input name="city" value="'+esc(l.city||'')+'"></label></div><div class="formrow"><label>Kaina<input name="price" type="number" value="'+esc(l.price||'')+'"></label><label>Tikslinė kaina<input name="target" type="number" value="'+esc(l.target||'')+'"></label></div><label>Telefonas<input name="phone" value="'+esc(l.phone||'')+'"></label><label>Statusas<select name="status"><option>Naujas</option><option>Skambinti</option><option>Derinamas</option><option>Atmestas</option><option>Nupirkta</option></select></label><label>Pastabos<textarea name="notes">'+esc(l.notes||'')+'</textarea></label></form>','<button class="btn" data-close="1">Atšaukti</button><button class="btn primary" data-savelead="'+esc(id||'')+'">Išsaugoti</button>');document.getElementById('leadForm').elements.status.value=l.status||'Naujas'}
function contactForm(id){var c=find(db.contacts,id)||{};openSheet(id?'Redaguoti klientą':'Naujas klientas','<form id="contactForm" class="form"><label>Vardas / įmonė<input name="name" required value="'+esc(c.name||'')+'"></label><div class="formrow"><label>Telefonas<input name="phone" value="'+esc(c.phone||'')+'"></label><label>Miestas<input name="city" value="'+esc(c.city||'')+'"></label></div><label>Tipas<select name="type"><option>Pirkėjas</option><option>Pardavėjas</option><option>Perpardavinėtojas</option><option>Ardytojas</option><option>Kita</option></select></label><label>Pastabos<textarea name="notes">'+esc(c.notes||'')+'</textarea></label></form>','<button class="btn" data-close="1">Atšaukti</button><button class="btn primary" data-savecontact="'+esc(id||'')+'">Išsaugoti</button>');document.getElementById('contactForm').elements.type.value=c.type||'Pirkėjas'}
function expenseForm(carId){if(!db.cars.length){toast('Pirma pridėk automobilį');return}var opts='',i;for(i=0;i<db.cars.length;i++)opts+='<option value="'+db.cars[i].id+'" '+(db.cars[i].id===carId?'selected':'')+'>'+esc(db.cars[i].brand+' '+db.cars[i].model)+'</option>';openSheet('Nauja išlaida','<form id="expenseForm" class="form"><label>Automobilis<select name="carId">'+opts+'</select></label><label>Suma<input name="amount" type="number" step="0.01" required></label><label>Tipas<input name="type" placeholder="Remontas, transportas..."></label><label>Pastaba<textarea name="note"></textarea></label></form>','<button class="btn" data-close="1">Atšaukti</button><button class="btn primary" data-saveexpense="1">Išsaugoti</button>')}
function find(arr,id){var i;for(i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function remove(arr,id){var i;for(i=arr.length-1;i>=0;i--)if(arr[i].id===id)arr.splice(i,1)}
function exportJson(){var blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='greitas-auto-kopija-'+today()+'.json';document.body.appendChild(a);a.click();a.parentNode.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},1000);toast('Kopija paruošta')}
function importJson(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.cars||!x.settings)throw new Error('Netinkamas failas');db=x;save();applyTheme();render();toast('Duomenys importuoti')}catch(err){toast('Importuoti nepavyko')}};r.readAsText(f)}
function applyTheme(){var t=db.settings.theme||localStorage.getItem(THEME)||'light';document.documentElement.setAttribute('data-theme',t);localStorage.setItem(THEME,t)}
function saveCar(id){var f=document.getElementById('carForm');if(!f.checkValidity()){f.reportValidity();return}var c=find(db.cars,id);if(!c){c={id:uid('car'),createdAt:now()};db.cars.unshift(c)}c.brand=formVal(f,'brand').trim();c.model=formVal(f,'model').trim();c.year=n(formVal(f,'year'));c.location=formVal(f,'location').trim();c.fuel=formVal(f,'fuel').trim();c.gear=formVal(f,'gear').trim();c.purchaseDate=formVal(f,'purchaseDate');c.purchasePrice=n(formVal(f,'purchasePrice'));c.quickPrice=n(formVal(f,'quickPrice'));c.listPrice=n(formVal(f,'listPrice'));c.status=formVal(f,'status');c.notes=formVal(f,'notes').trim();c.updatedAt=now();save();closeSheet();render();toast('Automobilis išsaugotas')}
function saveLead(id){var f=document.getElementById('leadForm');if(!f.checkValidity()){f.reportValidity();return}var l=find(db.leads,id);if(!l){l={id:uid('lead'),createdAt:now()};db.leads.unshift(l)}l.brand=formVal(f,'brand').trim();l.model=formVal(f,'model').trim();l.year=n(formVal(f,'year'));l.city=formVal(f,'city').trim();l.price=n(formVal(f,'price'));l.target=n(formVal(f,'target'));l.phone=formVal(f,'phone').trim();l.status=formVal(f,'status');l.notes=formVal(f,'notes').trim();save();closeSheet();render();toast('Variantas išsaugotas')}
function saveContact(id){var f=document.getElementById('contactForm');if(!f.checkValidity()){f.reportValidity();return}var c=find(db.contacts,id);if(!c){c={id:uid('contact'),createdAt:now()};db.contacts.unshift(c)}c.name=formVal(f,'name').trim();c.phone=formVal(f,'phone').trim();c.city=formVal(f,'city').trim();c.type=formVal(f,'type');c.notes=formVal(f,'notes').trim();save();closeSheet();render();toast('Klientas išsaugotas')}
function saveExpense(){var f=document.getElementById('expenseForm');if(!f.checkValidity()){f.reportValidity();return}db.expenses.unshift({id:uid('exp'),carId:formVal(f,'carId'),amount:n(formVal(f,'amount')),type:formVal(f,'type').trim(),note:formVal(f,'note').trim(),date:today(),createdAt:now()});save();closeSheet();render();toast('Išlaida pridėta')}
function action(name,id){if(name==='carForm')carForm(id);else if(name==='leadForm')leadForm(id);else if(name==='contactForm')contactForm(id);else if(name==='expenseForm')expenseForm(id);else if(name==='export')exportJson();else if(name==='sale'){var c=find(db.cars,id);if(c){c.status='Parduota';save();render();toast('Pažymėta kaip parduota')}}else if(name==='deleteCar'){if(confirm('Tikrai ištrinti automobilį?')){remove(db.cars,id);var i;for(i=db.expenses.length-1;i>=0;i--)if(db.expenses[i].carId===id)db.expenses.splice(i,1);save();render()}}else if(name==='deleteLead'){if(confirm('Tikrai ištrinti variantą?')){remove(db.leads,id);save();render()}}else if(name==='deleteContact'){if(confirm('Tikrai ištrinti klientą?')){remove(db.contacts,id);save();render()}}else if(name==='convertLead'){var l=find(db.leads,id);if(l){db.cars.unshift({id:uid('car'),brand:l.brand,model:l.model,year:l.year,location:l.city,purchaseDate:today(),purchasePrice:l.target,quickPrice:0,listPrice:0,status:'Sandėlyje',fuel:'',gear:'',notes:l.notes,createdAt:now()});l.status='Nupirkta';save();state.tab='cars';render();toast('Variantas paverstas automobiliu')}}else if(name==='reset'){if(confirm('Atkurti demo duomenis? Dabartiniai duomenys bus ištrinti.')){db=blank();seed(db);db=load();applyTheme();render();toast('Demo duomenys atkurti')}}}
document.addEventListener('click',function(e){var el=e.target;while(el&&el!==document){if(el.getAttribute&&el.getAttribute('data-tab')){state.tab=el.getAttribute('data-tab');render();return}if(el.getAttribute&&el.getAttribute('data-tabgo')){state.tab=el.getAttribute('data-tabgo');render();return}if(el.getAttribute&&el.getAttribute('data-action')){action(el.getAttribute('data-action'),el.getAttribute('data-id')||'');return}if(el.getAttribute&&el.getAttribute('data-carfilter')){state.carFilter=el.getAttribute('data-carfilter');renderCars();return}if(el.getAttribute&&el.getAttribute('data-leadfilter')){state.leadFilter=el.getAttribute('data-leadfilter');renderLeads();return}if(el.getAttribute&&el.getAttribute('data-close')){closeSheet();return}if(el.getAttribute&&el.getAttribute('data-savecar')!==null){saveCar(el.getAttribute('data-savecar'));return}if(el.getAttribute&&el.getAttribute('data-savelead')!==null){saveLead(el.getAttribute('data-savelead'));return}if(el.getAttribute&&el.getAttribute('data-savecontact')!==null){saveContact(el.getAttribute('data-savecontact'));return}if(el.getAttribute&&el.getAttribute('data-saveexpense')!==null){saveExpense();return}el=el.parentNode}});
document.getElementById('closeSheet').onclick=closeSheet;overlay.onclick=function(e){if(e.target===overlay)closeSheet()};document.getElementById('fab').onclick=function(){if(state.tab==='leads')leadForm('');else if(state.tab==='contacts')contactForm('');else carForm('')};document.getElementById('themeBtn').onclick=function(){db.settings.theme=(db.settings.theme==='dark'?'light':'dark');save();applyTheme()};
applyTheme();render();
})();
</script>
</body>
</html>
