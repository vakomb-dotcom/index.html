  <a class="skip" href="#app">Pereiti prie turinio</a>

    <header class="top">

  class DataLayer{
    constructor(){this.db=null;this.memory=Object.fromEntries(STORE_NAMES.map(n=>[n,new Map()]))}
    async open(){
      if(!('indexedDB' in window)){state.storageMode='memory';return this}
      try{
        this.db=await new Promise((resolve,reject)=>{
          const req=indexedDB.open(DB_NAME,DB_VERSION);
          req.onupgradeneeded=()=>{
            const db=req.result;const tx=req.transaction;
            const defs={
              vehicles:['status','createdAt','updatedAt'],vehiclePhotos:['vehicleId','sortOrder'],expenses:['vehicleId','date'],
              tasks:['vehicleId','dueDate','status'],leads:['status','callbackDate'],contacts:['type','name'],sales:['vehicleId','saleDate'],activity:['createdAt'],settings:[]
            };
            for(const [name,indexes] of Object.entries(defs)){
              const store=db.objectStoreNames.contains(name)?tx.objectStore(name):db.createObjectStore(name,{keyPath:'id'});
              for(const idx of indexes)if(!store.indexNames.contains(idx))store.createIndex(idx,idx,{unique:false});
            }
          };
          req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(new Error('Duomenų bazė užblokuota kito lango.'));
        });
        this.db.onversionchange=()=>this.db.close();state.storageMode='indexeddb';
      }catch(err){console.warn('IndexedDB unavailable, memory mode',err);state.storageMode='memory'}
      return this;
    }
    store(name,mode='readonly'){return this.db.transaction(name,mode).objectStore(name)}
    request(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
    async all(name){if(!this.db)return [...this.memory[name].values()];return this.request(this.store(name).getAll())}
    async get(name,id){if(!this.db)return this.memory[name].get(id)||null;return this.request(this.store(name).get(id))}
    async put(name,value){if(!value?.id)throw new Error('Įrašui trūksta ID.');if(!this.db){this.memory[name].set(value.id,structuredClone(value));return value.id}return this.request(this.store(name,'readwrite').put(value))}
    async delete(name,id){if(!this.db){this.memory[name].delete(id);return}return this.request(this.store(name,'readwrite').delete(id))}
    async clear(names){const list=Array.isArray(names)?names:[names];if(!this.db){list.forEach(n=>this.memory[n].clear());return}await new Promise((resolve,reject)=>{const tx=this.db.transaction(list,'readwrite');list.forEach(n=>tx.objectStore(n).clear());tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
    async byIndex(name,index,value){if(!this.db){return [...this.memory[name].values()].filter(x=>x[index]===value)}const store=this.store(name);if(!store.indexNames.contains(index))return (await this.all(name)).filter(x=>x[index]===value);return this.request(store.index(index).getAll(value))}
  }

    const quick=num(v.quickSalePrice)-cost;
    const listing=num(v.listingPrice)-cost;
    const potential=num(v.potentialAfterFixPrice)-cost;
    const sale=sales.slice().sort((a,b)=>String(b.saleDate||'').localeCompare(String(a.saleDate||'')))[0];
    const sold=Boolean(v.sold||v.status==='Parduota'||sale);
    const days=daysBetween(v.purchaseDate,sale?.saleDate||v.updatedAt);
    const roi=cost?quick/cost*100:0;
    const done=tasks.filter(t=>t.status==='Atlikta').length;
    const activeTasks=tasks.filter(t=>t.status!=='Atšaukta');
    const progress=activeTasks.length?Math.round(done/activeTasks.length*100):100;
    const min=num(v.targetProfitMin)||state.profitMin;
    const max=num(v.targetProfitMax)||state.profitMax;
    const tone=quick<0?'bad':quick<min?'warn':'good';
    const saleProfit=sale?num(sale.salePrice)-cost:0;
    return {expense,cost,quick,listing,potential,sale,sold,saleProfit,days,roi,progress,min,max,tone,
      repair:expense>min*.7||expense>num(v.purchasePrice)*.45,
      stand:!sold&&!v.archived&&days>=21,
      boost:!sold&&!v.archived&&days>=7,
      reseller:Math.max(0,num(v.potentialAfterFixPrice)-num(v.quickSalePrice))};
  }

  function contactMatchesVehicle(v,c){
    if(c.type==='pardavėjas')return false;
    const brands=tags(c.preferredBrands),bodies=tags(c.preferredBodyTypes),fuels=tags(c.preferredFuel);
    const price=num(v.quickSalePrice||v.listingPrice);
    return (!brands.length||brands.includes(String(v.brand||'').toLowerCase()))
      &&(!bodies.length||bodies.includes(String(v.bodyType||'').toLowerCase()))
      &&(!fuels.length||fuels.includes(String(v.fuel||'').toLowerCase()))
      &&(!c.wants4x4||String(v.driveType||'').toLowerCase().includes('4x4'))
      &&(!c.wantsAutomatic||v.gearbox==='Automatinė')
      &&(!num(c.budgetMax)||price<=num(c.budgetMax))
      &&!v.sold&&!v.archived&&v.status!=='Parduota';
  }

  function photoUrl(photo,thumb=true){

    const mapKey=photo.id+(thumb?'_t':'_f');if(map.has(mapKey))return map.get(mapKey);
    const blob=thumb?(photo.thumbBlob||photo.blob):photo.blob;if(!(blob instanceof Blob))return '';

  function chartSvg(stats){
    const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);months.push(monthKey(d))}
    const values=months.map(m=>stats.filter(s=>monthKey(s.sale?.saleDate)===m).reduce((sum,s)=>sum+num(s.profit),0));
    const max=Math.max(500,...values.map(v=>Math.abs(v)));const w=720,h=220,p=30,g=14;const bw=(w-p*2-g*(months.length-1))/months.length;const zero=h/2;
    const bars=values.map((v,i)=>{const bh=Math.max(v===0?2:5,Math.abs(v)/max*(h/2-p));const x=p+i*(bw+g);const y=v>=0?zero-bh:zero;const cls=v>=0?'var(--green)':'var(--red)';return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="6" fill="'+cls+'" opacity=".88"/><text class="chartValue" x="'+(x+bw/2).toFixed(1)+'" y="'+(v>=0?Math.max(12,y-6):Math.min(h-23,y+bh+14)).toFixed(1)+'" text-anchor="middle">'+(v?Math.round(v):'')+'</text><text class="chartLabel" x="'+(x+bw/2).toFixed(1)+'" y="'+(h-5)+'" text-anchor="middle">'+months[i].slice(5)+'</text>'}).join('');
    return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Šešių mėnesių pelno diagrama"><line x1="'+p+'" x2="'+(w-p)+'" y1="'+zero+'" y2="'+zero+'" stroke="var(--line2)"/>'+bars+'</svg>';
  }

  }

  async function imageToBlob(file,maxSide=1600,quality=.84){
    if(!(file instanceof Blob)||!String(file.type).startsWith('image/'))throw new Error('Pasirinktas failas nėra nuotrauka.');
    if(file.size>25*1024*1024)throw new Error('Nuotrauka per didelė (maks. 25 MB).');
    let bitmap=null,img=null,width=0,height=0;
    try{if('createImageBitmap' in window){bitmap=await createImageBitmap(file);width=bitmap.width;height=bitmap.height}else{const url=URL.createObjectURL(file);img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('Nepavyko nuskaityti nuotraukos.'));i.src=url});URL.revokeObjectURL(url);width=img.naturalWidth;height=img.naturalHeight}
      const scale=Math.min(1,maxSide/Math.max(width,height));const w=Math.max(1,Math.round(width*scale)),h=Math.max(1,Math.round(height*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(bitmap||img,0,0,w,h);
      const type=canvas.toDataURL('image/webp').startsWith('data:image/webp')?'image/webp':'image/jpeg';const blob=await new Promise(resolve=>canvas.toBlob(resolve,type,quality));if(!blob)throw new Error('Nepavyko apdoroti nuotraukos.');return blob;
    }finally{bitmap?.close?.()}
  }

    for(const file of list){const blob=await imageToBlob(file,1600,.84);const thumbBlob=await imageToBlob(file,480,.78);await state.db.put('vehiclePhotos',{id:uid('photo'),vehicleId,blob,thumbBlob,sortOrder:order++,name:file.name||'nuotrauka',createdAt:new Date().toISOString()})}
    revokePhotoUrls(vehicleId);return list.length;
  }

  function adText(v,c){return [v.brand+' '+v.model+', '+(v.year||'')+' m.',[v.fuel,v.gearbox,v.engine].filter(Boolean).join(', ')+(v.driveType?' · '+v.driveType:''),v.taValidUntil?'TA galioja iki '+dateLt(v.taValidUntil)+'.':'',v.location?'Automobilis: '+v.location+'.':'','Kaina: '+money(v.listingPrice)+'. Greitam sandoriui: '+money(v.quickSalePrice)+'.',v.notes?'Pastabos: '+v.notes:'','Domina konkretus ir greitas pirkėjas.'].filter(Boolean).join('\n')}
  function shareText(v,c){return [v.brand+' '+v.model+' '+(v.year||''),'Greitai: '+money(v.quickSalePrice),'Skelbimo kaina: '+money(v.listingPrice),'Savikaina: '+money(c.cost),'Greito pardavimo pelnas: '+money(c.quick),'Stovi: '+c.days+' d.',v.location||''].filter(Boolean).join('\n')}
  async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Tekstas nukopijuotas','success');return true}catch(_){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_e){}ta.remove();if(ok)toast('Tekstas nukopijuotas','success');else{window.prompt('Nukopijuok tekstą:',text)}return ok}}
  async function shareContent(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(err){if(err?.name==='AbortError')return}}await copyText(text)}
