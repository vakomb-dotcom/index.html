<script>
(function(){

  function all(s){return req(store(s).getAll())} function one(s,i){return req(store(s).get(i))} function put(s,v){return req(store(s,'readwrite').put(v))} function del(s,i){return req(store(s,'readwrite').delete(i))}

  async function init(){try{if(!('indexedDB' in window)){app.innerHTML=empty('Naršyklė nepalaiko IndexedDB','Naudok naujesnę Chrome, Edge arba Safari versiją.');return}state.db=await openDb();await settings();await seed(false);render()}catch(err){console.error(err);app.innerHTML=empty('Programos paleisti nepavyko',err.message||'Bandyk perkrauti puslapį.')}}
