function today(){return now().slice(0,10)}
function addDays(d,n){var x=new Date(d||today());x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function num(v){var x=Number(String(v==null?'':v).replace(',','.'));return isFinite(x)?x:0}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(v){var s=String(v||'').trim();return /^https?:\/\//i.test(s)?esc(s):''}
function money(v){try{return new Intl.NumberFormat('lt-LT',{style:'currency',currency:db.settings.currency||'EUR',maximumFractionDigits:0}).format(num(v))}catch(e){return Math.round(num(v))+' '+(db.settings.currency||'EUR')}}
function date(v){if(!v)return 'Nenurodyta';var d=new Date(v+'T12:00:00');return isNaN(d.getTime())?'Nenurodyta':d.toLocaleDateString('lt-LT')}
function days(a,b){if(!a)return 0;return Math.max(0,Math.floor((new Date((b||today())+'T12:00:00')-new Date(a+'T12:00:00'))/86400000))}
function blank(){return {version:5,cars:[],expenses:[],parts:[],tasks:[],leads:[],contacts:[],sales:[],dismantlers:[],soldParts:[],adTasks:[],settings:{currency:'EUR',theme:'light',company:'Greitas Auto'}}}
function normalize(x){var d=blank(),k;for(k in d)if(Object.prototype.hasOwnProperty.call(d,k)&&x[k]!=null)d[k]=x[k];['cars','expenses','parts','tasks','leads','contacts','sales','dismantlers','soldParts','adTasks'].forEach(function(a){if(!Array.isArray(d[a]))d[a]=[]});d.settings=Object.assign(blank().settings,x.settings||{});d.version=5;return d}
function load(){try{var raw=localStorage.getItem(KEY)||localStorage.getItem(LEGACY);if(raw)return normalize(JSON.parse(raw))}catch(e){}var d=blank();seed(d);return d}
function save(){try{db.version=5;localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Nepavyko išsaugoti – per daug nuotraukų. Atsisiųskite kopiją ir pašalinkite dalį nuotraukų.');return false}}

€.',createdAt:now()}];localStorage.setItem(KEY,JSON.stringify(d))}
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function remove(arr,id){for(var i=arr.length-1;i>=0;i--)if(arr[i].id===id)arr.splice(i,1)}
function carName(id){var c=find(db.cars,id);return c?c.brand+' '+c.model+' '+c.year:'Nepriskirta'}
function carOptions(selected,activeOnly){var out='<option value="">Nepriskirta</option>';db.cars.forEach(function(c){if(activeOnly&&c.status==='Parduotas')return;out+='<option value="'+esc(c.id)+'"'+(c.id===selected?' selected':'')+'>'+esc(c.brand+' '+c.model+' '+c.year)+'</option>'});return out}
function sum(arr,fn){return arr.reduce(function(s,x){return s+num(fn(x))},0)}
function carCalc(c){var exp=sum(db.expenses.filter(function(x){return x.carId===c.id}),function(x){return x.amount});var parts=sum(db.parts.filter(function(x){return x.carId===c.id&&x.status!=='Atšaukta'}),function(x){return num(x.qty)*num(x.unitPrice)});var taskCost=sum(db.tasks.filter(function(x){return x.carId===c.id}),function(x){return x.cost});var investment=num(c.purchasePrice)+exp+parts+taskCost;var sale=find(db.sales,c.saleId||'');var revenue=sale?num(sale.price):num(c.quickPrice);return {expenses:exp,parts:parts,tasks:taskCost,investment:investment,profit:revenue-investment,days:days(c.purchaseDate,sale&&sale.date),revenue:revenue}}
function badge(text,tone){return '<span class="badge '+(tone||'')+'"><i class="dot"></i>'+esc(text)+'</span>'}
function head(title,subtitle,action){return '<section class="pagehead"><div><h2>'+esc(title)+'</h2><p>'+esc(subtitle)+'</p></div><div class="page-actions">'+(action||'')+'</div></section>'}
function empty(title,text){return '<div class="empty"><b>'+esc(title)+'</b>'+esc(text||'')+'</div>'}
function toast(msg){toastEl.textContent=msg;toastEl.className='toast show';clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.className='toast'},2600)}
function toneStatus(s){if(/Gauta|Atlikta|Paruoštas|Parduotas|Nupirkta/.test(s))return 'tone-green';if(/Vėluoja|Atšaukta|Atmestas/.test(s))return 'tone-red';if(/Užsakyta|Vykdoma|Skambinti|Ruošiamas/.test(s))return 'tone-amber';return ''}
function setActive(){document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===state.tab)})}
function render(){setActive();if(state.tab==='cars')renderCars();else if(state.tab==='parts')renderParts();else if(state.tab==='tasks')renderTasks();else if(state.tab==='leads')renderLeads();else if(state.tab==='contacts')renderContacts();else if(state.tab==='settings')renderSettings();else renderDashboard()}
function renderDashboard(){var active=db.cars.filter(function(c){return c.status!=='Parduotas'}),capital=sum(active,function(c){return carCalc(c).investment}),potential=sum(active,function(c){return carCalc(c).profit}),ordered=db.parts.filter(function(p){return p.status==='Užsakyta'||p.status==='Vėluoja'}),openTasks=db.tasks.filter(function(t){return t.status!=='Atlikta'}),month=today().slice(0,7),monthlySales=db.sales.filter(function(s){return String(s.date).slice(0,7)===month}),realProfit=sum(monthlySales,function(s){var c=find(db.cars,s.carId);return c?num(s.price)-carCalc(c).investment:0});var attention=[];ordered.forEach(function(p){if(p.eta&&p.eta<today())attention.push({icon:'⚙',title:p.name,sub:'Dalis vėluoja · '+carName(p.carId),tab:'parts'})});openTasks.forEach(function(t){if(t.due&&t.due<=today())attention.push({icon:'✓',title:t.title,sub:(t.due<today()?'Vėluoja':'Terminas šiandien')+' · '+carName(t.carId),tab:'tasks'})});db.leads.forEach(function(l){if(l.nextAction&&l.nextAction<=today()&&l.status!=='Atmestas'&&l.status!=='Nupirkta')attention.push({icon:'◎',title:l.brand+' '+l.model,sub:'Reikia susisiekti · '+(l.phone||'nėra telefono'),tab:'leads'})});app.innerHTML=head('Verslo suvestinė','Aiškus vaizdas, kas vyksta šiandien.')+'<section class="grid kpis"><div class="kpi tone-blue"><span class="label">▣ Aktyvūs automobiliai</span><strong>'+active.length+'</strong><small>'+db.cars.filter(function(c){return c.status==='Paruoštas'}).length+' paruošta pardavimui</small></div><div class="kpi '+(potential>=0?'tone-green':'tone-red')+'"><span class="label">↗ Galimas pelnas</span><strong>'+money(potential)+'</strong><small>Pagal greito pardavimo kainą</small></div><div class="kpi tone-amber"><span class="label">◆ Investuotas kapitalas</span><strong>'+money(capital)+'</strong><small>Auto, dalys, darbai ir išlaidos</small></div><div class="kpi tone-purple"><span class="label">● Šio mėnesio pelnas</span><strong>'+money(realProfit)+'</strong><small>'+monthlySales.length+' pardavimai</small></div></section><section class="grid dashboard-grid"><div class="card panel"><div class="panel-title"><div><h3>Reikia dėmesio</h3><p>Vėluojantys ir šiandienos veiksmai</p></div><span class="badge tone-red">'+attention.length+'</span></div>'+(attention.length?attention.slice(0,7).map(function(x){return '<button class="listrow" data-tabgo="'+x.tab+'" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left"><span class="listrow-main"><span class="avatar">'+x.icon+'</span><span><h4>'+esc(x.title)+'</h4><p class="meta">'+esc(x.sub)+'</p></span></span><span>›</span></button>'}).join(''):empty('Viskas tvarkoje','Skubių darbų nėra.'))+'</div><div class="card panel"><div class="panel-title"><div><h3>Greiti veiksmai</h3><p>Naujas įrašas keliais paspaudimais</p></div></div><div class="grid quickgrid"><button class="btn soft" data-action="carForm">＋ Auto</button><button class="btn soft" data-action="partForm">＋ Dalis</button><button class="btn soft" data-action="taskForm">＋ Darbas</button><button class="btn soft" data-action="expenseForm">＋ Išlaida</button><button class="btn soft" data-action="leadForm">＋ Variantas</button><button class="btn soft" data-action="contactForm">＋ Klientas</button></div></div></section><section class="card panel" style="margin-top:12px"><div class="panel-title"><div><h3>Automobilių pelningumas</h3><p>Aktyvūs automobiliai pagal investiciją</p></div><button class="btn sm" data-tabgo="cars">Visi auto</button></div>'+(active.length?active.slice(0,6).map(function(c){var x=carCalc(c),margin=x.revenue?Math.max(0,Math.min(100,x.investment/x.revenue*100)):100;return '<div class="listrow"><div style="min-width:0;flex:1"><div class="row"><h4>'+esc(c.brand+' '+c.model+' '+c.year)+'</h4><strong class="'+(x.profit>=0?'money-plus':'money-minus')+'">'+money(x.profit)+'</strong></div><div class="progress"><i style="width:'+margin+'%"></i></div><p class="meta">Investuota '+money(x.investment)+' · '+x.days+' d.</p></div></div>'}).join(''):empty('Automobilių nėra','Pridėkite pirmą automobilį.'))+'</section>'}
function filterBar(placeholder,filters){return '<section class="toolbar"><div class="search"><span>⌕</span><input id="sectionSearch" type="search" placeholder="'+esc(placeholder)+'" value="'+esc(state.search)+'"></div><div class="segments">'+filters.map(function(f){return '<button data-filter="'+esc(f)+'" class="'+(state.filter===f?'active':'')+'">'+esc(f)+'</button>'}).join('')+'</div></section>'}
function bindSearch(){var el=document.getElementById('sectionSearch');if(el)el.oninput=function(){state.search=this.value;render()}}
function renderCars(){var q=state.search.toLowerCase(),arr=db.cars.filter(function(c){var x=carCalc(c),hay=[c.brand,c.model,c.year,c.vin,c.location,c.status].join(' ').toLowerCase();return (!q||hay.indexOf(q)>=0)&&(state.filter==='Visi'||state.filter===c.status||(state.filter==='Pelningi'&&x.profit>=0)||(state.filter==='Nuostolingi'&&x.profit<0))});app.innerHTML=head('Automobiliai','Visa automobilio istorija ir reali savikaina.','<button class="btn primary" data-action="carForm">＋ <span>Pridėti</span></button>')+filterBar('Ieškoti markės, VIN, miesto...',['Visi','Ruošiamas','Paruoštas','Rezervuotas','Parduotas','Pelningi','Nuostolingi'])+'<section class="grid cards">'+(arr.length?arr.map(carCard).join(''):empty('Nieko nerasta','Pakeiskite paiešką arba filtrą.'))+'</section>';bindSearch()}
function carCard(c){var x=carCalc(c),pt=x.profit>=0?'tone-green':'tone-red';return '<article class="card item"><div class="row"><div><h3>'+esc(c.brand+' '+c.model+' '+c.year)+'</h3><div class="meta">'+esc(c.location||'Vieta nenurodyta')+' · '+esc(c.fuel||'Kuras nenurodytas')+(c.mileage?' · '+num(c.mileage).toLocaleString('lt-LT')+' km':'')+'</div></div>'+badge(c.status||'Nupirktas',toneStatus(c.status||''))+'</div><div class="badges">'+badge((c.status==='Parduotas'?'Pelnas ':'Galimas pelnas ')+money(x.profit),pt)+badge('Sandėlyje '+x.days+' d.')+'</div><div class="stats"><div class="stat"><small>Pirkimo kaina</small><strong>'+money(c.purchasePrice)+'</strong></div><div class="stat"><small>Papildomai</small><strong>'+money(x.expenses+x.parts+x.tasks)+'</strong></div><div class="stat"><small>Savikaina</small><strong>'+money(x.investment)+'</strong></div></div><div class="actions"><button class="btn sm" data-action="carDetail" data-id="'+c.id+'">Peržiūra</button><button class="btn sm" data-action="expenseForm" data-id="'+c.id+'">Išlaida</button><button class="btn sm" data-action="partForm" data-id="'+c.id+'">Dalis</button><button class="btn sm" data-action="taskForm" data-id="'+c.id+'">Darbas</button>'+(c.status!=='Parduotas'?'<button class="btn sm success" data-action="saleForm" data-id="'+c.id+'">Parduoti</button>':'')+'</div></article>'}
function renderParts(){db.parts.forEach(function(p){if(p.status==='Užsakyta'&&p.eta&&p.eta<today())p.status='Vėluoja'});var q=state.search.toLowerCase(),arr=db.parts.filter(function(p){var hay=[p.name,p.code,p.supplier,p.status,carName(p.carId)].join(' ').toLowerCase();return (!q||hay.indexOf(q)>=0)&&(state.filter==='Visi'||p.status===state.filter)}).sort(function(a,b){return String(b.orderDate).localeCompare(String(a.orderDate))});app.innerHTML=head('Dalių užsakymai','Užsakymas, pristatymas ir dalių kaina vienoje vietoje.','<button class="btn primary" data-action="partForm">＋ <span>Užsakymas</span></button>')+filterBar('Ieškoti dalies, kodo, tiekėjo...',['Visi','Planuojama','Užsakyta','Vėluoja','Gauta','Sumontuota','Atšaukta'])+'<section class="grid cards">'+(arr.length?arr.map(partCard).join(''):empty('Užsakymų nėra','Pridėkite pirmą dalies užsakymą.'))+'</section>';bindSearch();save()}
function partCard(p){var total=num(p.qty)*num(p.unitPrice),late=p.status==='Vėluoja';return '<article class="card item"><div class="row"><div><h3>'+esc(p.name)+'</h3><div class="meta">'+esc(p.supplier||'Tiekėjas nenurodytas')+(p.code?' · '+esc(p.code):'')+'</div></div>'+badge(p.status||'Planuojama',toneStatus(p.status||''))+'</div><div class="badges">'+badge(carName(p.carId))+badge('Kiekis '+num(p.qty))+'</div><div class="stats"><div class="stat"><small>Užsakyta</small><strong>'+date(p.orderDate)+'</strong></div><div class="stat"><small>Numatoma</small><strong class="'+(late?'overdue':'')+'">'+date(p.eta)+'</strong></div><div class="stat"><small>Suma</small><strong>'+money(total)+'</strong></div></div>'+(p.tracking?'<p class="meta detail-note">Siuntos nr.: '+esc(p.tracking)+'</p>':'')+'<div class="actions"><button class="btn sm" data-action="editPart" data-id="'+p.id+'">Redaguoti</button>'+(p.status!=='Gauta'&&p.status!=='Sumontuota'&&p.status!=='Atšaukta'?'<button class="btn sm success" data-action="partReceived" data-id="'+p.id+'">Gauta</button>':'')+(p.status==='Gauta'?'<button class="btn sm success" data-action="partInstalled" data-id="'+p.id+'">Sumontuota</button>':'')+'<button class="btn sm danger" data-action="deletePart" data-id="'+p.id+'">Trinti</button></div></article>'}
function renderTasks(){var q=state.search.toLowerCase(),arr=db.tasks.filter(function(t){var hay=[t.title,t.assignee,t.priority,t.status,carName(t.carId)].join(' ').toLowerCase();return (!q||hay.indexOf(q)>=0)&&(state.filter==='Visi'||t.status===state.filter||t.priority===state.filter||(state.filter==='Vėluoja'&&t.status!=='Atlikta'&&t.due&&t.due<today()))}).sort(function(a,b){return String(a.due||'9999').localeCompare(String(b.due||'9999'))});app.innerHTML=head('Darbai','Remontai, paruošimas ir svarbūs terminai.','<button class="btn primary" data-action="taskForm">＋ <span>Darbas</span></button>')+filterBar('Ieškoti darbo ar atsakingo...',['Visi','Laukiama','Vykdoma','Atlikta','Vėluoja','Aukštas'])+'<section class="grid cards">'+(arr.length?arr.map(taskCard).join(''):empty('Darbų nėra','Sukurkite pirmą užduotį.'))+'</section>';bindSearch()}
function taskCard(t){var late=t.status!=='Atlikta'&&t.due&&t.due<today(),status=late?'Vėluoja':t.status;return '<article class="card item"><div class="row"><div><h3>'+esc(t.title)+'</h3><div class="meta">'+esc(carName(t.carId))+'</div></div>'+badge(status,toneStatus(status))+'</div><div class="badges">'+badge(t.priority||'Vidutinis',t.priority==='Aukštas'?'tone-red':'')+(t.assignee?badge(t.assignee):'')+'</div><div class="stats"><div class="stat"><small>Terminas</small><strong class="'+(late?'overdue':'')+'">'+date(t.due)+'</strong></div><div class="stat"><small>Numatyta kaina</small><strong>'+money(t.cost)+'</strong></div><div class="stat"><small>Būsena</small><strong>'+esc(status||'Laukiama')+'</strong></div></div>'+(t.note?'<p class="meta detail-note">'+esc(t.note)+'</p>':'')+'<div class="actions"><button class="btn sm" data-action="editTask" data-id="'+t.id+'">Redaguoti</button>'+(t.status!=='Atlikta'?'<button class="btn sm success" data-action="taskDone" data-id="'+t.id+'">Atlikta</button>':'')+'<button class="btn sm danger" data-action="deleteTask" data-id="'+t.id+'">Trinti</button></div></article>'}
function renderLeads(){var q=state.search.toLowerCase(),arr=db.leads.filter(function(l){var hay=[l.brand,l.model,l.city,l.phone,l.status].join(' ').toLowerCase();return (!q||hay.indexOf(q)>=0)&&(state.filter==='Visi'||l.status===state.filter)});app.innerHTML=head('Pirkimo variantai','Dominantys automobiliai, derybos ir kitas veiksmas.','<button class="btn primary" data-action="leadForm">＋ <span>Variantas</span></button>')+filterBar('Ieškoti varianto...',['Visi','Naujas','Skambinti','Derinamas','Nupirkta','Atmestas'])+'<section class="grid cards">'+(arr.length?arr.map(leadCard).join(''):empty('Variantų nėra','Įrašykite dominantį automobilį.'))+'</section>';bindSearch()}
function leadCard(l){var target=num(l.target),diff=num(l.price)-target,url=safeUrl(l.url);return '<article class="card item"><div class="row"><div><h3>'+esc(l.brand+' '+l.model+' '+(l.year||''))+'</h3><div class="meta">'+esc(l.city||'Vieta nenurodyta')+(l.phone?' · '+esc(l.phone):'')+'</div></div>'+badge(l.status||'Naujas',toneStatus(l.status||''))+'</div><div class="stats" style="margin-top:11px"><div class="stat"><small>Pardavėjo kaina</small><strong>'+money(l.price)+'</strong></div><div class="stat"><small>Jūsų tikslas</small><strong>'+money(l.target)+'</strong></div><div class="stat"><small>Reikia nuderėti</small><strong>'+money(diff)+'</strong></div></div><p class="meta detail-note">Kitas veiksmas: '+date(l.nextAction)+(l.notes?'\n'+esc(l.notes):'')+'</p><div class="actions">'+(l.phone?'<a class="btn sm" href="tel:'+esc(String(l.phone).replace(/[^0-9+]/g,''))+'">Skambinti</a>':'')+(url?'<a class="btn sm" target="_blank" rel="noopener" href="'+url+'">Skelbimas</a>':'')+'<button class="btn sm" data-action="leadForm" data-id="'+l.id+'">Redaguoti</button><button class="btn sm success" data-action="convertLead" data-id="'+l.id+'">Nupirkta</button><button class="btn sm danger" data-action="deleteLead" data-id="'+l.id+'">Trinti</button></div></article>'}

nkite susietas išlaidas, dalis ir darbus');remove(m[1],id);save();closeSheet();render();toast('Įrašas ištrintas')}}else if(name==='reset'&&confirm('Atkurti demonstracinius duomenis? Dabartiniai duomenys bus ištrinti.')){db=blank();seed(db);db=load();applyTheme();render();toast('Demonstraciniai duomenys atkurti')}}

/* Supaprastinta mobilioji versija */
function head(title,subtitle,actionHtml){return '<section class="pagehead"><h2>'+esc(title)+'</h2><div class="page-actions">'+(actionHtml||'')+'</div></section>'}
function photoSrc(v){return /^data:image\/(jpeg|jpg|png|webp);base64,/i.test(String(v||''))?v:''}
function photoStrip(photos,cover){var a=Array.isArray(photos)?photos.filter(photoSrc):[];if(!a.length)return '';if(cover)return '<img class="photo-cover" src="'+a[0]+'" alt="Automobilio nuotrauka">';return '<div class="photo-strip">'+a.map(function(x){return '<img class="photo-thumb" src="'+x+'" alt="Nuotrauka">'}).join('')+'</div>'}
function photoField(photos){return '<label class="filepick">📷 Pasirinkti nuotraukas<input name="photos" type="file" accept="image/*" multiple></label>'+photoStrip(photos,false)+(photos&&photos.length?'<label class="check"><input name="clearPhotos" type="checkbox">Pašalinti senas nuotraukas</label>':'')+'<p class="help">Iki 4 nuotraukų. Jos automatiškai sumažinamos.</p>'}
function compressPhoto(file){return new Promise(function(resolve){if(!file||!/^image\//.test(file.type)){resolve('');return}var reader=new FileReader();reader.onerror=function(){resolve('')};reader.onload=function(){var img=new Image();img.onerror=function(){resolve('')};img.onload=function(){var max=1100,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',.72))};img.src=reader.result};reader.readAsDataURL(file)})}
async function collectPhotos(form,old){var keep=form.elements.clearPhotos&&form.elements.clearPhotos.checked?[]:(Array.isArray(old)?old.slice(0,4):[]),files=form.elements.photos&&form.elements.photos.files?Array.from(form.elements.photos.files):[];for(var i=0;i<files.length&&keep.length<4;i++){var p=await compressPhoto(files[i]);if(p)keep.push(p)}return keep}
function render(){setActive();if(state.tab==='cars')renderCars();else if(state.tab==='dismantle')renderDismantle();else if(state.tab==='parts')renderParts();else if(state.tab==='tasks')renderTasks();else if(state.tab==='leads')renderLeads();else if(state.tab==='contacts')renderContacts();else if(state.tab==='settings')renderSettings();else renderDashboard()}
function renderDashboard(){var active=db.cars.filter(function(c){return c.status!=='Parduotas'}),profit=sum(active,function(c){return carCalc(c).profit}),partRevenue=sum(db.soldParts,function(p){return p.price}),openTasks=db.tasks.filter(function(t){return t.status!=='Atlikta'}).length;app.innerHTML=head('Suvestinė','')+'<section class="grid kpis"><div class="kpi tone-blue"><span class="label">Automobiliai</span><strong>'+active.length+'</strong></div><div class="kpi '+(profit>=0?'tone-green':'tone-red')+'"><span class="label">Galimas pelnas</span><strong>'+money(profit)+'</strong></div><div class="kpi tone-purple"><span class="label">Parduotos dalys</span><strong>'+money(partRevenue)+'</strong></div><div class="kpi tone-amber"><span class="label">Atviri darbai</span><strong>'+openTasks+'</strong></div></section><section class="card panel" style="margin-top:12px"><div class="panel-title"><h3>Pridėti</h3></div><div class="grid quickgrid"><button class="btn soft" data-action="carForm">＋ Auto</button><button class="btn soft" data-action="dismantleForm">＋ Ardymas</button><button class="btn soft" data-action="expenseForm">＋ Išlaida</button><button class="btn soft" data-action="partForm">＋ Dalis</button><button class="btn soft" data-action="taskForm">＋ Darbas</button><button class="btn soft" data-action="leadForm">＋ Variantas</button></div></section><section class="card panel" style="margin-top:12px"><div class="panel-title"><h3>Aktyvūs auto</h3><button class="btn sm" data-tabgo="cars">Visi</button></div>'+(active.length?active.slice(0,5).map(function(c){var x=carCalc(c);return '<button class="listrow" data-tabgo="cars" style="width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left"><span class="listrow-main"><span class="avatar">▣</span><span><h4>'+esc(c.brand+' '+c.model+' '+(c.year||''))+'</h4><p class="meta">'+esc(c.status)+' · '+x.days+' d.</p></span></span><strong class="'+(x.profit>=0?'money-plus':'money-minus')+'">'+money(x.prof function renderCars(){var q=state.search.toLowerCase(),arr=db.cars.filter(function(c){var x=carCalc(c),hay=[c.brand,c.model,c.year,c.location,c.status].join(' ').toLowerCase();return (!q||hay.indexOf(q)>=0)&&(state.filter==='Visi'||state.filter===c.status||(state.filter==='Pelningi'&&x.profit>=0)||(state.filter==='Nuostolingi'&&x.profit<0))});app.innerHTML=head('Automobiliai','','<button class="btn primary" data-action="carForm">＋</button>')+filterBar('Ieškoti...',['Visi','Ruošiamas','Paruoštas','Rezervuotas','Parduotas'])+'<section class="grid cards">'+(arr.length?arr.map(carCard).join(''):empty('Nieko nerasta',''))+'</section>';bindSearch()}

async function saveCar(id){var f=document.getElementById('carForm');if(!f||!f.checkValidity()){if(f)f.reportValidity();return}var c=find(db.cars,id);if(!c){c={id:uid('car'),createdAt:now(),photos:[]};db.cars.unshift(c)}c.brand=val(f,'brand').trim();c.model=val(f,'model').trim();c.year=num(val(f,'year'));c.location=val(f,'location').trim();c.purchasePrice=num(val(f,'purchasePrice'));c.purchaseDate=val(f,'purchaseDate');c.quickPrice=num(val(f,'quickPrice'));c.listPrice=num(val(f,'listPrice'));c.status=val(f,'status');c.notes=val(f,'notes').trim();c.photos=await collectPhotos(f,c.photos);c.updatedAt=now();if(!save())return;closeSheet();render();toast('Automobilis išsaugotas')}

function render(){setActive();if(state.tab==='cars')renderCars();else if(state.tab==='dismantle')renderDismantle();else if(state.tab==='parts')renderParts();else if(state.tab==='tasks')renderTasks();else if(state.tab==='leads')renderLeads();else if(state.tab==='contacts')renderContacts();else if(state.tab==='ads')renderAds();else if(state.tab==='settings')renderSettings();else if(state.tab==='more')renderMore();else renderDashboard()}
function setActive(){var shown=/^(parts|leads|contacts|ads|settings)$/.test(state.tab)?'more':state.tab;document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===shown)})}
function leadForm(id){var l=find(db.leads,id)||{};openSheet(id?'Keisti variantą':'Naujas variantas','<form id="leadForm" class="form"><div class="formrow"><label>Markė *<input name="brand" required value="'+esc(l.brand||'')+'"></label><label>Modelis *<input name="model" required value="'+esc(l.model||'')+'"></label></div><label>Metai<input name="year" type="number" inputmode="numeric" value="'+esc(l.year||'')+'"></label><div class="formrow"><label>Kaina<input name="price" type="number" inputmode="decimal" step="0.01" value="'+esc(l.price||'')+'"></label><label>Tikslinė kaina<input name="target" type="number" inputmode="decimal" step="0.01" value="'+esc(l.target||'')+'"></label></div><div class="formrow"><label>Telefonas<input name="phone" inputmode="tel" value="'+esc(l.phone||'')+'"></label><label>Susisiekti<input name="nextAction" type="date" value="'+esc(l.nextAction||today())+'"></label></div><label>Statusas<select name="status"><option>Naujas</option><option>Skambinti</option><option>Derinamas</option><option>Nupirkta</option><option>Atmestas</option></select></label><label>Pastaba<textarea name="notes">'+esc(l.notes||'')+'</textarea></label>'+photoField(l.photos||[])+'</form>',standardFoot('data-savelead',id));selectValue(document.getElementById('leadForm'),'status',l.status||'Naujas')}
async function saveLead(id){var f=document.getElementById('leadForm');if(!f||!f.checkValidity()){if(f)f.reportValidity();return}var l=find(db.leads,id);if(!l){l={id:uid('lead'),createdAt:now(),photos:[]};db.leads.unshift(l)}l.brand=val(f,'brand').trim();l.model=val(f,'model').trim();l.year=num(val(f,'year'));l.price=num(val(f,'price'));l.target=num(val(f,'target'));l.phone=val(f,'phone').trim();l.nextAction=val(f,'nextAction');l.status=val(f,'status');l.notes=val(f,'notes').trim();l.photos=await collectPhotos(f,l.photos);l.updatedAt=now();if(!save())return;closeSheet();render();toast('Variantas išsaugotas')}
function leadCard(l){var diff=num(l.price)-num(l.target);return '<article class="card item">'+photoStrip(l.photos,true)+'<div class="row"><h3>'+esc(l.brand+' '+l.model+' '+(l.year||''))+'</h3>'+badge(l.status||'Naujas',toneStatus(l.status||''))+'</div><div class="cost-strip"><div class="cost-box"><small>Kaina</small><strong>'+money(l.price)+'</strong></div><div class="cost-box"><small>Tikslas</small><strong>'+money(l.target)+'</strong></div><div class="cost-box"><small>Nuderėti</small><strong>'+money(diff)+'</strong></div></div>'+(l.notes?'<p class="meta detail-note">'+esc(l.notes)+'</p>':'')+'<div class="actions">'+(l.phone?'<a class="btn sm" href="tel:'+esc(String(l.phone).replace(/[^0-9+]/g,''))+'">Skambinti</a>':'')+'<button class="btn sm" data-action="leadForm" data-id="'+l.id+'">Keisti</button><button class="btn sm success" data-convert-lead="'+l.id+'">Nupirkta</button><button class="btn sm danger" data-action="deleteLead" data-id="'+l.id+'">Trinti</button></div></article>'}
function convertLeadPhotos(id){var l=find(db.leads,id);if(!l||!confirm('Sukurti automobilį iš šio varianto?'))return;db.cars.unshift({id:uid('car'),brand:l.brand,model:l.model,year:l.year,purchaseDate:today(),purchasePrice:l.target||l.price,quickPrice:0,listPrice:0,status:'Nupirktas',photos:Array.isArray(l.photos)?l.photos.slice():[],notes:l.notes||'',createdAt:now()});l.status='Nupirkta';save();state.tab='cars';resetFilters();render();toast('Automobilis sukurtas')}
function adNextStatus(s){var map={'Idėja':'Suplanuota','Suplanuota':'Daroma','Daroma':'Atlikta','Atlikta':'Idėja'};return map[s]||'Suplanuota'}
function adTone(a){if(a.status==='Atlikta')return 'tone-green';if(a.due&&a.due<today())return 'tone-red';if(a.priority==='Skubu')return 'tone-red';if(a.status==='Daroma')return 'tone-amber';return 'tone-purple'}
function renderAds(){var q=state.search.toLowerCase(),open=db.adTasks.filter(function(a){return a.status!=='Atlikta'}),urgent=open.filter(function(a){return a.priority==='Skubu'}).length,overdue=open.filter(function(a){return a.due&&a.due<today()}).length,arr=db.adTasks.filter(function(a){var hay=[a.title,a.platform,a.type,a.status,a.notes,carName(a.carId)].join(' ').toLowerCase();return (!q||hay.indexOf(q)>=0)&&(state.filter==='Visi'||a.status===state.filter||a.priority===state.filter)}).sort(function(a,b){return String(a.due||'9999').localeCompare(String(b.due||'9999'))});app.innerHTML=head('Reklamos','','<button class="btn primary" data-action="adTaskForm">＋</button>')+'<section class="ad-summary"><div class="stat"><small>Atviros</small><strong>'+open.length+'</strong></div><div class="stat"><small>Skubios</small><strong>'+urgent+'</strong></div><div class="stat"><small>Vėluoja</small><strong>'+overdue+'</strong></div></section>'+filterBar('Ieškoti...',['Visi','Idėja','Suplanuota','Daroma','Atlikta','Skubu'])+'<section class="grid cards">'+(arr.length?arr.map(adCard).join(''):empty('Reklamos darbų nėra',''))+'</section>';bindSearch()}
function adCard(a){var late=a.status!=='Atlikta'&&a.due&&a.due<today(),pc=a.priority==='Skubu'?'priority-high':a.priority==='Svarbu'?'priority-medium':'priority-low';return '<article class="card item '+pc+'"><div class="row"><div><h3>'+esc(a.title)+'</h3><div class="meta">'+esc(a.type||'Užduotis')+(a.carId?' · '+esc(carName(a.carId)):'')+'</div></div>'+badge(late?'Vėluoja':a.status,adTone(a))+'</div><div class="badges"><span class="ad-platform">'+esc(a.platform||'Bendra')+'</span>'+badge(a.priority||'Svarbu')+(a.due?badge(date(a.due),late?'tone-red':''):'')+'</div>'+(a.notes?'<p class="meta detail-note">'+esc(a.notes)+'</p>':'')+'<div class="actions">'+(a.status!=='Atlikta'?'<button class="btn sm success" data-advance-ad="'+a.id+'">→ '+esc(adNextStatus(a.status))+'</button>':'<button class="btn sm" data-advance-ad="'+a.id+'">Atnaujinti</button>')+'<button class="btn sm" data-action="adTaskForm" data-id="'+a.id+'">Keisti</button><button class="btn sm danger" data-delete-ad="'+a.id+'">Trinti</button></div></article>'}
function adTaskForm(id){var a=find(db.adTasks,id)||{};openSheet(id?'Keisti reklamos darbą':'Naujas reklamos darbas','<form id="adTaskForm" class="form"><label>Ką reikia padaryti? *<input name="title" required value="'+esc(a.title||'')+'" placeholder="Pvz., atnaujinti Facebook reklamą"></label><div class="formrow"><label>Platforma<select name="platform"><option>Facebook</option><option>Instagram</option><option>Skelbiu.lt</option><option>Autoplius</option><option>Google</option><option>TikTok</option><option>Bendra</option><option>Kita</option></select></label><label>Darbo tipas<select name="type"><option>Patobulinti</option><option>Sukurti naują</option><option>Paleisti</option><option>Patikrinti</option><option>Nufotografuoti</option><option>Parašyti tekstą</option></select></label></div><label>Susietas automobilis<select name="carId">'+carOptions(a.carId||'',false)+'</select></label><div class="formrow"><label>Prioritetas<select name="priority"><option>Skubu</option><option>Svarbu</option><option>Kai bus laiko</option></select></label><label>Terminas<input name="due" type="date" value="'+esc(a.due||'')+'"></label></div><label>Būsena<select name="status"><option>Idėja</option><option>Suplanuota</option><option>Daroma</option><option>Atlikta</option></select></label><label>Pastaba<textarea name="notes">'+esc(a.notes||'')+'</textarea></label></form>',standardFoot('data-savead',id));var f=document.getElementById('adTaskForm');selectValue(f,'platform',a.platform||'Facebook');selectValue(f,'type',a.type||'Patobulinti');selectValue(f,'priority',a.priority||'Svarbu');selectValue(f,'status',a.status||'Idėja')}
function saveAdTask(id){saveForm('adTaskForm',id,db.adTasks,'ad',{title:'s',platform:'s',type:'s',carId:'s',priority:'s',due:'s',status:'s',notes:'s'})}
function renderMore(){var ordered=db.parts.filter(function(p){return p.status==='Užsakyta'||p.status==='Vėluoja'}).length,leads=db.leads.filter(function(l){return l.status!=='Atmestas'&&l.status!=='Nupirkta'}).length,ads=db.adTasks.filter(function(a){return a.status!=='Atlikta'}).length;app.innerHTML=head('Daugiau','')+'<section class="hub-grid"><button class="hub-tile" data-tabgo="parts"><b>⚙</b><strong>Dalys</strong><small>'+ordered+' laukiama</small></button><button class="hub-tile" data-tabgo="leads"><b>◎</b><strong>Variantai</strong><small>'+leads+' aktyvūs</small></button><button class="hub-tile ads" data-tabgo="ads"><b>✦</b><strong>Reklamos</strong><small>'+ads+' darbai</small></button><button class="hub-tile" data-tabgo="contacts"><b>♙</b><strong>Kontaktai</strong><small>'+db.contacts.length+' išsaugota</small></button><button class="hub-tile" data-tabgo="settings"><b>⚒</b><strong>Nustatymai</strong><small>Kopijos ir tema</small></button></section><section class="card panel section-gap"><button class="btn" style="width:100%" data-action="export">Atsisiųsti atsarginę kopiją</button></section>'}
function quickAdd(){openSheet('Ką pridėti?','<div class="quick-sheet"><button class="quick-item" data-action="carForm"><b>▣</b><span>Auto</span></button><button class="quick-item" data-action="dismantleForm"><b>◫</b><span>Ardymas</span></button><button class="quick-item" data-action="expenseForm"><b>€</b><span>Išlaida</span></button><button class="quick-item" data-action="partForm"><b>⚙</b><span>Dalis</span></button><button class="quick-item" data-action="taskForm"><b>✓</b><span>Darbas</span></button><button class="quick-item" data-action="adTaskForm"><b>✦</b><span>Reklama</span></button></div>','<button class="btn" data-close>Uždaryti</button>')}
function todayItems(){var out=[];db.tasks.forEach(function(t){if(t.status!=='Atlikta'&&t.due&&t.due<=today())out.push({icon:'✓',title:t.title,sub:(t.due<today()?'Vėluoja':'Šiandien')+' · '+carName(t.carId),tab:'tasks',tone:t.due<today()?'tone-red':'tone-amber'})});db.parts.forEach(function(p){if((p.status==='Užsakyta'||p.status==='Vėluoja')&&p.eta&&p.eta<=today())out.push({icon:'⚙',title:p.name,sub:(p.eta<today()?'Vėluoja':'Atvyksta šiandien')+' · '+carName(p.carId),tab:'parts',tone:p.eta<today()?'tone-red':'tone-blue'})});db.leads.forEach(function(l){if(l.status!=='Atmestas'&&l.status!=='Nupirkta'&&l.nextAction&&l.nextAction<=today())out.push({icon:'◎',title:l.brand+' '+l.model,sub:'Susisiekti'+(l.phone?' · '+l.phone:''),tab:'leads',tone:'tone-purple'})});db.adTasks.forEach(function(a){if(a.status!=='Atlikta'&&a.due&&a.due<=today())out.push({icon:'✦',title:a.title,sub:(a.due<today()?'Reklama vėluoja':'Reklama šiandien')+' · '+a.platform,tab:'ads',tone:a.due<today()?'tone-red':'tone-purple'})});return out}
document.addEventListener('click',function(e){var el=e.target.closest('button,a');if(!el)return;if(el.dataset.tab){state.tab=el.dataset.tab;resetFilters();render();window.scrollTo(0,0);return}if(el.dataset.tabgo){state.tab=el.dataset.tabgo;resetFilters();render();window.scrollTo(0,0);return}if(el.dataset.resulttab){closeSheet();state.tab=el.dataset.resulttab;resetFilters();render();return}if(el.dataset.action){action(el.dataset.action,el.dataset.id||'');return}if(el.dataset.filter){state.filter=el.dataset.filter;render();return}if(el.hasAttribute('data-close')){closeSheet();return}if(el.hasAttribute('data-savecar'))saveCar(el.dataset.savecar);else if(el.hasAttribute('data-saveexpense'))saveExpense(el.dataset.saveexpense);else if(el.hasAttribute('data-savepart'))savePart(el.dataset.savepart);else if(el.hasAttribute('data-savetask'))saveTask(el.dataset.savetask);else if(el.hasAttribute('data-savelead'))saveLead(el.dataset.savelead);else if(el.hasAttribute('data-savecontact'))saveContact(el.dataset.savecontact);else if(el.hasAttribute('data-savesale'))saveSale(el.dataset.savesale)});
document.addEventListener('click',function(e){var el=e.target.closest('button');if(!el)return;var a=el.dataset.action;if(a==='dismantleForm'||a==='soldPartForm'||a==='editSoldPart'||a==='deleteSoldPart'||a==='deleteDismantle')actionMobile(a,el.dataset.id||'');if(el.hasAttribute('data-savedismantle'))saveDismantle(el.dataset.savedismantle);else if(el.hasAttribute('data-savesoldpart'))saveSoldPart(el.dataset.savesoldpart)});
document.getElementById('closeSheet').onclick=closeSheet;overlay.onclick=function(e){if(e.target===overlay)closeSheet()};document.addEventListener('keydown',function(e){if(e.key==='Escape'&&overlay.classList.contains('open'))closeSheet()});document.getElementById('themeBtn').onclick=function(){db.settings.theme=db.settings.theme==='dark'?'light':'dark';save();applyTheme()};document.getElementById('globalSearchBtn').onclick=globalSearch;document.getElementById('fab').onclick=function(){if(state.tab==='parts')action('partForm','');else if(state.tab==='tasks')action('taskForm','');else if(state.tab==='leads')leadForm('');else if(state.tab==='contacts')contactForm('');else carForm('')};
document.getElementById('fab').onclick=function(){if(state.tab==='dismantle')dismantleForm('');else if(state.tab==='parts')action('partForm','');else if(state.tab==='tasks')action('taskForm','');else if(state.tab==='leads')leadForm('');else if(state.tab==='contacts')contactForm('');else carForm('')};
document.addEventListener('click',function(e){var el=e.target.closest('button');if(!el)return;if(el.hasAttribute('data-open-car'))carDetail(el.dataset.openCar);if(el.hasAttribute('data-cycle-status'))premiumAction('cycleStatus',el.dataset.cycleStatus);if(navigator.vibrate)navigator.vibrate(8)});
document.addEventListener('click',function(e){var el=e.target.closest('button');if(!el)return;if(el.dataset.action==='adTaskForm')adTaskForm(el.dataset.id||'');if(el.hasAttribute('data-savead'))saveAdTask(el.dataset.savead);if(el.hasAttribute('data-advance-ad')){var a=find(db.adTasks,el.dataset.advanceAd);if(a){a.status=adNextStatus(a.status);save();render();toast('Būsena: '+a.status)}}if(el.hasAttribute('data-delete-ad')&&confirm('Ištrinti reklamos darbą?')){remove(db.adTasks,el.dataset.deleteAd);save();render();toast('Darbas ištrintas')}if(el.hasAttribute('data-convert-lead'))convertLeadPhotos(el.dataset.convertLead)});
document.getElementById('fab').onclick=quickAdd;
applyTheme();render();
})();
</script>
</body>
