function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function remove(arr,id){for(var i=arr.length-1;i>=0;i--)if(arr[i].id===id)arr.splice(i,1)}
function carName(id){var c=find(db.cars,id);return c?c.brand+' '+c.model+' '+c.year:'Nepriskirta'}
function carOptions(selected,activeOnly){var out='<option value="">Nepriskirta</option>';db.cars.forEach(function(c){if(activeOnly&&c.status==='Parduotas')return;out+='<option value="'+esc(c.id)+'"'+(c.id===selected?' selected':'')+'>'+esc(c.brand+' '+c.model+' '+c.year)+'</option>'});return out}
function sum(arr,fn){return arr.reduce(function(s,x){return s+num(fn(x))},0)}
function carCalc(c){var exp=sum(db.expenses.filter(function(x){return x.carId===c.id}),function(x){return x.amount});var parts=sum(db.parts.filter(function(x){return x.carId===c.id&&x.status!=='Atšaukta'}),function(x){return num(x.qty)*num(x.unitPrice)});var taskCost=sum(db.tasks.filter(function(x){return x.carId===c.id}),function(x){return x.cost});var investment=num(c.purchasePrice)+exp+parts+taskCost;var sale=find(db.sales,c.saleId||'');var revenue=sale?num(sale.price):num(c.quickPrice);return {expenses:exp,parts:parts,tasks:taskCost,investment:investment,profit:revenue-investment,days:days(c.purchaseDate,sale&&sale.date),revenue:revenue}}
function badge(text,tone){return '<span class="badge '+(tone||'')+'"><i class="dot"></i>'+esc(text)+'</span>'}
function head(title,subtitle,action){return '<section class="pagehead"><div><h2>'+esc(title)+'</h2><p>'+esc(subtitle)+'</p></div><div class="page-actions">'+(action||'')+'</div></section>'}
function empty(title,text){return '<div class="empty"><b>'+esc(title)+'</b>'+esc(text||'')+'</div>'}
function toast(msg){toastEl.textContent=msg;toastEl.className='toast show';clearTimeout(toastEl._t);toastEl._t=setTimeout(function(){toastEl.className='toast'},2600)}
function toneStatus(s){if(/Gauta|Atlikta|Paruoštas|Parduotas|Nupirkta/.test(s))return 'tone-green';if(/Vėluoja|Atšaukta|Atmestas/.test(s))return 'tone-red';if(/Užsakyta|Vykdoma|Skambinti|Ruošiamas/.test(s))return 'tone-amber';return ''}
function setActive(){document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===state.tab)})}
function render(){setActive();if(state.tab==='cars')renderCars();else if(state.tab==='parts')renderParts();else if(state.tab==='tasks')renderTasks();else if(state.tab==='leads')renderLeads();else if(state.tab==='contacts')renderContacts();else if(state.tab==='settings')renderSettings();else renderDashboard()}
function renderDashboard(){var active=db.cars.filter(function(c){return c.status!=='Parduotas'}),capital=sum(active,function(c){return carCalc(c).investment}),potential=sum(active,function(c){return carCalc(c).profit}),ordered=db.parts.filter(function(p){return p.status==='Užsakyta'||p.status==='Vėluoja'}),openTasks=db.tasks.filter(function(t){return t.status!=='Atlikta'}),month=today().slice(0,7),monthlySales=db.sales.filter(function(s){return String(s.date).slice(0,7)===month}),realProfit=sum(monthlySales,function(s){var c=find(db.cars,s.carId);return c?num(s.price)-carCalc(c).investment:0});var attention=[];ordered.forEach(function(p){if(p.eta&&p.eta<today())attention.push({icon:'⚙',title:p.name,sub:'Dalis vėluoja · '+carName(p.carId),tab:'parts'})});openTasks.forEach(function(t){if(t.due&&t.due<=today())attention.push({icon:'✓',title:t.title,sub:(t.due<today()?'Vėluoja':'Terminas šiandien')+' · '+carName(t.carId),tab:'tasks'})});db.leads.forEach(function(l){if(l.nextAction&&l.nextAction<=today()&&l.status!=='Atmestas'&&l.status!=='Nupirkta')attention.push({icon:'◎',title:l.brand+' '+l.model,sub:'Reikia susisiekti · '+(l.phone||'nėra telefono'),tab:'leads'})});app.innerHTML=head('Verslo suvestinė','Aiškus vaizdas, kas vyksta šiandien.')+'<section class="grid kpis"><div class="kpi tone-blue"><span class="label">▣ Aktyvūs automobiliai</span><strong>'+active.length+'</strong><small>'+db.cars.filter(function(c){return c.status==='Paruoštas'}).length+' paruošta pardavimui</small></div><div class="kpi '+(potential>=0?'tone-green':'tone-red')+'"><span class="label">↗ Galimas pelnas</span><strong>'+money(potential)+'</strong><small>Pagal greito pardavimo kainą</small></div><div class="kpi tone-amber"><span class="label">◆ Investuotas kapitalas</span><strong>'+money(capital)+'</strong><small>Auto, dalys, darbai ir išlaidos</small></div><div class="kpi tone-purple"><span class="label">● Šio mėnesio pelnas</span><strong>'+money(realProfit)+'</strong><small>'+monthlySales.length+' pardavimai</small></div></section><section class="grid dashboard-grid"><div class="card panel"><div class="panel-title"><div><h3>Reikia dėmesio</h3><p>Vėluojantys ir šiandienos veiksmai</p></div><span class="badge tone-red">'+attention.length+'</span></div>'+(attention.length?attention.slice(0,7).map(function(x){return '<button class="listrow" data-tabgo="'+x.tab+'" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left"><span class="listrow-main"><span class="avatar">'+x.icon+'</span><span><h4>'+esc(x.title)+'</h4><p class="meta">'+esc(x.sub)+'</p></span></span><span>›</span></button>'}).join(''):empty('Viskas tvarkoje','Skubių darbų nėra.'))+'</div><div class="card panel"><div class="panel-title"><div><h3>Greiti veiksmai</h3><p>Naujas įrašas keliais paspaudimais</p></div></div><div class="grid quickgrid"><button class="btn soft" data-action="carForm">＋ Auto</button><button class="btn soft" data-action="partForm">＋ Dalis</button><button class="btn soft" data-action="taskForm">＋ Darbas</button><button class="btn soft" data-action="expenseForm">＋ Išlaida</button><button class="btn soft" data-action="leadForm">＋ Variantas</button><button class="btn soft" data-action="contactForm">＋ Klientas</button></div></div></section><section class="card panel" style="margin-top:12px"><div class="panel-title"><div><h3>Automobilių pelningumas</h3><p>Aktyvūs automobiliai pagal investiciją</p></div><button class="btn sm" data-tabgo="cars">Visi auto</button></div>'+(active.length?active.slice(0,6).map(function(c){var x=carCalc(c),margin=x.revenue?Math.max(0,Math.min(100,x.investment/x.revenue*100)):100;return '<div class="listrow"><div style="min-width:0;flex:1"><div class="row"><h4>'+esc(c.brand+' '+c.model+' '+c.year)+'</h4><strong class="'+(x.profit>=0?'money-plus':'money-minus')+'">'+money(x.profit)+'</strong></div><div class="progress"><i style="width:'+margin+'%"></i></div><p class="meta">Investuota '+money(x.investment)+' · '+x.days+' d.</p></div></div>'}).join(''):empty('Automobilių nėra','Pridėkite pirmą automobilį.'))+'</section>'}
function filterBar(placeholder,filters){return '<section class="toolbar"><div class="search"><span>⌕</span><input id="sectionSearch" type="search" placeholder="'+esc(placeholder)+'" value="'+esc(state.search)+'"></div><div class="segments">'+filters.map(function(f){return '<button data-filter="'+esc(f)+'" class="'+(state.filter===f?'active':'')+'">'+esc(f)+'</button>'}).join('')+'</div></section>'}

function renderCars(){var q=state.search.toLowerCase(),arr=db.cars.filter(function(c){var x=carCalc(c),hay=[c.brand,c.model,c.year,c.vin,c.location,c.status].join(' ').toLowerCase();return (!q||hay.indexOf(q)>=0)&&(state.filter==='Visi'||state.filter===c.status||(state.filter==='Pelningi'&&x.profit>=0)||(state.filter==='Nuostolingi'&&x.profit<0))});app.innerHTML=head('Automobiliai','Visa automobilio istorija ir reali savikaina.','<button class="btn primary" data-action="carForm">＋ <span>Pridėti</span></button>')+filterBar('Ieškoti markės, VIN, miesto...',['Visi','Ruošiamas','Paruoštas','Rezervuotas','Parduotas','Pelningi','Nuostolingi'])+'<section class="grid cards">'+(arr.length?arr.map(carCard).join(''):empty('Nieko nerasta','Pakeiskite paiešką arba filtrą.'))+'</section>';bindSearch()}
function carCard(c){var x=carCalc(c),pt=x.profit>=0?'tone-green':'tone-red';return '<article class="card item"><div class="row"><div><h3>'+esc(c.brand+' '+c.model+' '+c.year)+'</h3><div class="meta">'+esc(c.location||'Vieta nenurodyta')+' · '+esc(c.fuel||'Kuras nenurodytas')+(c.mileage?' · '+num(c.mileage).toLocaleString('lt-LT')+' km':'')+'</div></div>'+badge(c.status||'Nupirktas',toneStatus(c.status||''))+'</div><div class="badges">'+badge((c.status==='Parduotas'?'Pelnas ':'Galimas pelnas ')+money(x.profit),pt)+badge('Sandėlyje '+x.days+' d.')+'</div><div class="stats"><div class="stat"><small>Pirkimo kaina</small><strong>'+money(c.purchasePrice)+'</strong></div><div class="stat"><small>Papildomai</small><strong>'+money(x.expenses+x.parts+x.tasks)+'</strong></div><div class="stat"><small>Savikaina</small><strong>'+money(x.investment)+'</strong></div></div><div class="actions"><button class="btn sm" data-action="carDetail" data-id="'+c.id+'">Peržiūra</button><button class="btn sm" data-action="expenseForm" data-id="'+c.id+'">Išlaida</button><button class="btn sm" data-action="partForm" data-id="'+c.id+'">Dalis</button><button class="btn sm" data-action="taskForm" data-id="'+c.id+'">Darbas</button>'+(c.status!=='Parduotas'?'<button class="btn sm success" data-action="saleForm" data-id="'+c.id+'">Parduoti</button>':'')+'</div></article>'}
function renderParts(){db.parts.forEach(function(p){if(p.status==='Užsakyta'&&p.eta&&p.eta<today())p.status='Vėluoja'});var q=state.search.toLowerCase(),arr=db.parts.filter(function(p){var hay=[p.name,p.code,p.supplier,p.status,carName(p.carId)].join(' ').toLowerCase();return (!q||hay.indexOf(q)>=0)&&(state.filter==='Visi'||p.status===state.filter)}).sort(function(a,b){return String(b.orderDate).localeCompare(String(a.orderDate))});app.innerHTML=head('Dalių užsakymai','Užsakymas, pristatymas ir dalių kaina vienoje vietoje.','<button class="btn primary" data-action="partForm">＋ <span>Užsakymas</span></button>')+filterBar('Ieškoti dalies, kodo, tiekėjo...',['Visi','Planuojama','Užsakyta','Vėluoja','Gauta','Sumontuota','Atšaukta'])+'<section class="grid cards">'+(arr.length?arr.map(partCard).join(''):empty('Užsakymų nėra','Pridėkite pirmą dalies užsakymą.'))+'</section>';bindSearch();save()}
function partCard(p){var total=num(p.qty)*num(p.unitPrice),late=p.status==='Vėluoja';return '<article class="card item"><div class="row"><div><h3>'+esc(p.name)+'</h3><div class="meta">'+esc(p.supplier||'Tiekėjas nenurodytas')+(p.code?' · '+esc(p.code):'')+'</div></div>'+badge(p.status||'Planuojama',toneStatus(p.status||''))+'</div><div class="badges">'+badge(carName(p.carId))+badge('Kiekis '+num(p.qty))+'</div><div class="stats"><div class="stat"><small>Užsakyta</small><strong>'+date(p.orderDate)+'</strong></div><div class="stat"><small>Numatoma</small><strong class="'+(late?'overdue':'')+'">'+date(p.eta)+'</strong></div><div class="stat"><small>Suma</small><strong>'+money(total)+'</strong></div></div>'+(p.tracking?'<p class="meta detail-note">Siuntos nr.: '+esc(p.tracking)+'</p>':'')+'<div class="actions"><button class="btn sm" data-action="editPart" data-id="'+p.id+'">Redaguoti</button>'+(p.status!=='Gauta'&&p.status!=='Sumontuota'&&p.status!=='Atšaukta'?'<button class="btn sm success" data-action="partReceived" data-id="'+p.id+'">Gauta</button>':'')+(p.status==='Gauta'?'<button class="btn sm success" data-action="partInstalled" data-id="'+p.id+'">Sumontuota</button>':'')+'<button class="btn sm danger" data-action="deletePart" data-id="'+p.id+'">Trinti</button></div></article>'}
function renderTasks(){var q=state.search.toLowerCase(),arr=db.tasks.filter(function(t){var hay=[t.title,t.assignee,t.priority,t.status,carName(t.carId)].join(' ').toLowerCase();return (!q||hay.indexOf(q)>=0)&&(state.filter==='Visi'||t.status===state.filter||t.priority===state.filter||(state.filter==='Vėluoja'&&t.status!=='Atlikta'&&t.due&&t.due<today()))}).sort(function(a,b){return String(a.due||'9999').localeCompare(String(b.due||'9999'))});app.innerHTML=head('Darbai','Remontai, paruošimas ir svarbūs terminai.','<button class="btn primary" data-action="taskForm">＋ <span>Darbas</span></button>')+filterBar('Ieškoti darbo ar atsakingo...',['Visi','Laukiama','Vykdoma','Atlikta','Vėluoja','Aukštas'])+'<section class="grid cards">'+(arr.length?arr.map(taskCard).join(''):empty('Darbų nėra','Sukurkite pirmą užduotį.'))+'</section>';bindSearch()}
function taskCard(t){var late=t.status!=='Atlikta'&&t.due&&t.due<today(),status=late?'Vėluoja':t.status;return '<article class="card item"><div class="row"><div><h3>'+esc(t.title)+'</h3><div class="meta">'+esc(carName(t.carId))+'</div></div>'+badge(status,toneStatus(status))+'</div><div class="badges">'+badge(t.priority||'Vidutinis',t.priority==='Aukštas'?'tone-red':'')+(t.assignee?badge(t.assignee):'')+'</div><div class="stats"><div class="stat"><small>Terminas</small><strong class="'+(late?'overdue':'')+'">'+date(t.due)+'</strong></div><div class="stat"><small>Numatyta kaina</small><strong>'+money(t.cost)+'</strong></div><div class="stat"><small>Būsena</small><strong>'+esc(status||'Laukiama')+'</strong></div></div>'+(t.note?'<p class="meta detail-note">'+esc(t.note)+'</p>':'')+'<div class="actions"><button class="btn sm" data-action="editTask" data-id="'+t.id+'">Redaguoti</button>'+(t.status!=='Atlikta'?'<button class="btn sm success" data-action="taskDone" data-id="'+t.id+'">Atlikta</button>':'')+'<button class="btn sm danger" data-action="deleteTask" data-id="'+t.id+'">Trinti</button></div></article>'}
function renderLeads(){var q=state.search.toLowerCase(),arr=db.leads.filter(function(l){var hay=[l.brand,l.model,l.city,l.phone,l.status].join(' ').toLowerCase();return (!q||hay.indexOf(q)>=0)&&(state.filter==='Visi'||l.status===state.filter)});app.innerHTML=head('Pirkimo variantai','Dominantys automobiliai, derybos ir kitas veiksmas.','<button class="btn primary" data-action="leadForm">＋ <span>Variantas</span></button>')+filterBar('Ieškoti varianto...',['Visi','Naujas','Skambinti','Derinamas','Nupirkta','Atmestas'])+'<section class="grid cards">'+(arr.length?arr.map(leadCard).join(''):empty('Variantų nėra','Įrašykite dominantį automobilį.'))+'</section>';bindSearch()}

async function decodeVinOnline(){var f=document.getElementById('vehicleCheckForm');if(!f)return;var vin=val(f,'vin').toUpperCase().replace(/\s/g,''),box=document.getElementById('decoderResult');f.elements.vin.value=vin;box.className='decoder-result show';if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){box.textContent='VIN turi būti 17 simbolių';return}var info=europeanVinInfo(vin);if(info.make&&!f.elements.make.value)f.elements.make.value=info.make;if(info.country)f.elements.originCountry.value=info.country;box.textContent=[info.make||'Gamintojas nenustatytas',info.country||info.region||'Tarptautinis VIN','WMI '+info.wmi].join(' · ')}
function saveVehicleCheck(id){var f=document.getElementById('vehicleCheckForm');if(!f)return;var vin=val(f,'vin').toUpperCase().replace(/\s/g,''),plate=val(f,'plate').toUpperCase().replace(/\s/g,'');if(!vin&&!plate){toast('Įveskite VIN arba valstybinį numerį');return}if(vin&&!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){toast('Patikrinkite VIN formatą');return}var c=find(db.vehicleChecks,id),isNew=!c;if(!c){c={id:uid('check'),createdAt:now()};db.vehicleChecks.unshift(c)}c.vin=vin;c.plate=plate;c.documentNo=val(f,'documentNo').trim().toUpperCase();c.make=val(f,'make').trim();c.model=val(f,'model').trim();c.originCountry=val(f,'originCountry').trim();c.year=num(val(f,'year'));c.mileage=num(val(f,'mileage'));c.taStatus=val(f,'taStatus');c.taUntil=val(f,'taUntil');c.insuranceStatus=val(f,'insuranceStatus');c.insuranceUntil=val(f,'insuranceUntil');c.searchStatus=val(f,'searchStatus');c.restrictionsStatus=val(f,'restrictionsStatus');c.bodyClass=val(f,'bodyClass').trim();c.fuel=val(f,'fuel').trim();c.engine=val(f,'engine').trim();c.notes=val(f,'notes').trim();c.updatedAt=now();if(!save())return;logAction(isNew?'create':'edit',(isNew?'Sukurta patikra: ':'Atnaujinta patikra: ')+(c.plate||c.vin));closeSheet();state.tab='checks';render();toast('Patikra išsaugota')}
function checkCard(c){var values=[c.taStatus,c.insuranceStatus,c.searchStatus,c.restrictionsStatus],done=values.filter(function(x){return x&&x!=='Nežinoma'}).length,title=[c.make,c.model,c.year].filter(Boolean).join(' ')||c.plate||'Automobilio patikra';return '<article class="card check-card"><div class="check-title"><div><h3>'+esc(title)+'</h3><div class="check-identifiers">'+(c.plate?'<b>'+esc(c.plate)+'</b>':'')+(c.vin?'<b>'+esc(c.vin)+'</b>':'')+(c.originCountry?'<b>'+esc(c.originCountry)+'</b>':'')+'</div></div>'+badge(done+'/4')+'</div><div class="check-progress"><i style="width:'+(done*25)+'%"></i></div><div class="check-status-grid"><div class="check-status"><span>TA</span><strong class="'+checkTone(c.taStatus)+'">'+esc(c.taStatus||'Nežinoma')+(c.taUntil?' · '+date(c.taUntil):'')+'</strong></div><div class="check-status"><span>Draudimas</span><strong class="'+checkTone(c.insuranceStatus)+'">'+esc(c.insuranceStatus||'Nežinoma')+(c.insuranceUntil?' · '+date(c.insuranceUntil):'')+'</strong></div><div class="check-status"><span>Paieška</span><strong class="'+checkTone(c.searchStatus)+'">'+esc(c.searchStatus||'Nežinoma')+'</strong></div><div class="check-status"><span>Apribojimai</span><strong class="'+checkTone(c.restrictionsStatus)+'">'+esc(c.restrictionsStatus||'Nežinoma')+'</strong></div></div>'+(c.mileage?'<div class="check-note">'+num(c.mileage).toLocaleString('lt-LT')+' km</div>':'')+(c.notes?'<div class="check-note">'+esc(c.notes)+'</div>':'')+'<div class="actions"><button class="btn sm" data-check-edit="'+c.id+'">Keisti</button><button class="btn sm danger" data-check-delete="'+c.id+'">Trinti</button></div></article>'}
function openExternalUrl(url){if(!/^https:\/\//i.test(url||''))return;try{if(window.cordova&&window.cordova.InAppBrowser){window.cordova.InAppBrowser.open(url,'_system');return}}catch(e){}try{window.open(url,'_blank','noopener,noreferrer');return}catch(e){}var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer external';document.body.appendChild(a);a.click();a.remove()}
document.addEventListener('click',function(e){var el=e.target.closest('[data-external-url]');if(!el)return;e.preventDefault();e.stopPropagation();openExternalUrl(el.dataset.externalUrl)});
function renderChecks(){var rows=db.vehicleChecks.slice().sort(function(a,b){return String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt))});app.innerHTML=head('Automobilio patikra','', '<button class="btn primary" data-check-new>＋</button>')+'<section class="card panel checks-sources"><div class="panel-title"><h3>Patikros šaltiniai</h3></div>'+officialCheckLinks()+'</section><section class="grid cards">'+(rows.length?rows.map(checkCard).join(''):'<div class="empty"><b>Patikrų nėra</b></div>')+'</section>'}
function taskCarOptions(selected){var out='<option value="">Bendras darbas</option>';db.cars.forEach(function(c){if(c.status==='Parduotas'&&c.id!==selected)return;out+='<option value="'+esc(c.id)+'"'+(c.id===selected?' selected':'')+'>'+esc(c.brand+' '+c.model+' '+(c.year||''))+'</option>'});return out}
function taskForm(carId,id){var t=find(db.tasks,id)||{},selected=t.carId!=null?t.carId:(carId||'');openSheet(id?'Keisti darbą':'Naujas darbas','<form id="taskForm" class="form"><label>Priskyrimas<select name="carId">'+taskCarOptions(selected)+'</select></label><label>Ką reikia padaryti? *<input name="title" required value="'+esc(t.title||'')+'"></label><label>Tipas<select name="category"><option>Garažas</option><option>Dokumentai</option><option>Pirkimas</option><option>Pardavimas</option><option>Reklama</option><option>Draudimas</option><option>Fotografuoti</option><option>Facebook</option><option>Kainos mažinimas</option><option>Remontas</option><option>Kita</option></select></label><div class="formrow"><label>Terminas<input name="due" type="date" value="'+esc(t.due||'')+'"></label><label>Būsena<select name="status"><option>Laukiama</option><option>Vykdoma</option><option>Atlikta</option></select></label></div><label>Kaina, jei yra<input name="cost" type="number" inputmode="decimal" step="0.01" value="'+esc(t.cost||'')+'"></label><label>Pastaba<textarea name="note">'+esc(t.note||'')+'</textarea></label></form>',standardFoot('data-savetask',id));var f=document.getElementById('taskForm');selectValue(f,'category',t.category||'Kita');selectValue(f,'status',t.status||'Laukiama')}
function taskIsVisible(t){return state.filter==='Visi'||t.status===state.filter||(state.filter==='Vėluoja'&&t.status!=='Atlikta'&&t.due&&t.due<today())}
function taskSort(a,b){var ad=a.status==='Atlikta'?1:0,bd=b.status==='Atlikta'?1:0;if(ad!==bd)return ad-bd;return String(a.due||'9999').localeCompare(String(b.due||'9999'))||String(b.createdAt||'').localeCompare(String(a.createdAt||''))}
function taskCard(t,isGeneral){var late=t.status!=='Atlikta'&&t.due&&t.due<today(),status=late?'Vėluoja':(t.status||'Laukiama');return '<article class="card item '+(isGeneral?'general-work-card':'')+'"><div class="row"><div><h3>'+esc(t.title)+'</h3>'+(!isGeneral?'<div class="meta">'+esc(carName(t.carId))+'</div>':'')+'</div>'+badge(status,toneStatus(status))+'</div><div class="badges">'+(isGeneral?'<span class="work-scope">Bendras</span>':'')+'<span class="reminder-type">'+esc(t.category||'Kita')+'</span>'+(t.due?badge(date(t.due),late?'tone-red':''):'')+(num(t.cost)?badge(money(t.cost)):'')+'</div>'+(t.note?'<p class="meta detail-note">'+esc(t.note)+'</p>':'')+'<div class="actions"><button class="btn sm" data-action="editTask" data-id="'+t.id+'">Keisti</button>'+(t.status!=='Atlikta'?'<button class="btn sm success" data-action="taskDone" data-id="'+t.id+'">Atlikta</button>':'')+'<button class="btn sm danger" data-action="deleteTask" data-id="'+t.id+'">Trinti</button></div></article>'}
function renderTasks(){var arr=db.tasks.filter(taskIsVisible).sort(taskSort),general=arr.filter(function(t){return !t.carId}),cars=arr.filter(function(t){return !!t.carId});app.innerHTML=head('Darbai','', '<button class="btn primary" data-action="taskForm">＋</button>')+filterBar('', ['Visi','Laukiama','Vykdoma','Atlikta','Vėluoja'])+'<section class="task-section"><div class="task-section-head"><h3>Bendri darbai</h3><span class="badge">'+general.length+'</span></div><div class="grid cards">'+(general.length?general.map(function(t){return taskCard(t,true)}).join(''):'<div class="task-empty">Bendrų darbų nėra</div>')+'</div></section><section class="task-section"><div class="task-section-head"><h3>Automobilių darbai</h3><span class="badge">'+cars.length+'</span></div><div class="grid cards">'+(cars.length?cars.map(function(t){return taskCard(t,false)}).join(''):'<div class="task-empty">Automobilių darbų nėra</div>')+'</div></section>'}
function todayItems(){var out=[];db.tasks.forEach(function(t){if(t.carId&&t.status!=='Atlikta'&&t.due&&t.due<=today())out.push({icon:'✓',title:t.title,sub:(t.due<today()?'Vėluoja':'Šiandien')+' · '+carName(t.carId),tab:'tasks',tone:t.due<today()?'tone-red':'tone-amber'})});db.parts.forEach(function(p){if((p.status==='Užsakyta'||p.status==='Vėluoja')&&p.eta&&p.eta<=today())out.push({icon:'⚙',title:p.name,sub:(p.eta<today()?'Vėluoja':'Atvyksta šiandien')+' · '+carName(p.carId),tab:'parts',tone:p.eta<today()?'tone-red':'tone-blue'})});db.leads.forEach(function(l){if(l.status!=='Atmestas'&&l.status!=='Nupirkta'&&l.nextAction&&l.nextAction<=today())out.push({icon:'◎',title:l.brand+' '+l.model,sub:'Susisiekti'+(l.phone?' · '+l.phone:''),tab:'leads',tone:'tone-purple'})});db.adTasks.forEach(function(a){if(a.status!=='Atlikta'&&a.due&&a.due<=today())out.push({icon:'✦',title:a.title,sub:(a.due<today()?'Reklama vėluoja':'Reklama šiandien')+' · '+a.platform,tab:'ads',tone:a.due<today()?'tone-red':'tone-purple'})});return out}
function renderDashboard(){var b=businessStats(),items=todayItems(),general=db.tasks.filter(function(t){return !t.carId&&t.status!=='Atlikta'}).sort(taskSort);app.innerHTML=head('Pradžia','')+'<section class="today-profit"><div class="earnings-split"><div class="earning-block"><span>Šiandien uždirbta</span><strong>'+signedMoney(b.today)+'</strong></div><div class="earning-block"><span>Šią savaitę</span><strong>'+signedMoney(b.week)+'</strong></div></div></section><section class="card panel section-gap"><div class="panel-title"><h3>Šiandien</h3>'+(items.length?'<span class="badge tone-red">'+items.length+'</span>':'')+'</div>'+(items.length?'<div class="today-list">'+items.slice(0,5).map(function(x){return '<button class="today-item" data-tabgo="'+x.tab+'"><span class="avatar '+x.tone+'">'+x.icon+'</span><span><strong>'+esc(x.title)+'</strong><small>'+esc(x.sub)+'</small></span><span>›</span></button>'}).join('')+'</div>':'<div class="empty" style="padding:20px"><b>Šiandien viskas padaryta ✓</b></div>')+'</section><section class="card panel section-gap"><div class="panel-title"><h3>Bendri darbai</h3><button class="btn sm" data-action="taskForm">＋ Pridėti</button></div>'+(general.length?general.slice(0,5).map(function(t){var late=t.due&&t.due<today();return '<button class="general-task" data-action="editTask" data-id="'+t.id+'"><span class="general-task-icon">✓</span><span><strong>'+esc(t.title)+'</strong><small class="'+(late?'overdue':'')+'">'+esc(t.category||'Kita')+(t.due?' · '+date(t.due):'')+'</small></span><span>›</span></button>'}).join(''):'<div class="empty" style="padding:20px"><b>Bendrų darbų nėra</b></div>')+(general.length>5?'<button class="btn sm" style="width:100%;margin-top:8px" data-tabgo="tasks">Visi darbai · '+general.length+'</button>':'')+'</section>';hydrateMedia(app)}
